<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab PDF Studio — Alpha 0.9.24 TEST</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#1f2933;margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(720px,calc(100% - 32px));background:#fff;border:1px solid #d7dde3;border-radius:14px;padding:26px;box-shadow:0 14px 40px #20304018}.bar{height:7px;background:#e5e9ed;border-radius:99px;overflow:hidden;margin:18px 0}.bar:before{content:"";display:block;width:45%;height:100%;background:#d39a35;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}.err{color:#8f251e;background:#fff1f0;border:1px solid #ebaaa4;padding:11px;border-radius:8px}</style></head><body><div class="box"><h2>nLab PDF Studio</h2><p>Chargement de <b id="loadingVersion">Alpha 0.9.24 TEST</b>…</p><div class="bar"></div><p>Sélection de pages par cases · portée multi-pages · menus · connexion/espace personnel · nommage séparé · traduction · ZIP/Drive · métadonnées de version centralisées.</p><div id="err"></div></div><script>
(async()=>{
  try{
    const TARGET="0.9.24";
    const fetchText=async(url,label)=>{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok)throw new Error(label+" : HTTP "+r.status);
      return r.text();
    };
    const versions=JSON.parse(await fetchText("./versions.json","Registre des versions inaccessible"));
    const release=(versions.versions||[]).find(x=>x.version===TARGET)||{version:TARGET,label:"Alpha "+TARGET+" TEST",date:""};
    document.getElementById("loadingVersion").textContent=release.label||("Alpha "+TARGET+" TEST");
    let h=await fetchText("./app-0.9.12.html","Base 0.9.12 inaccessible");
    if(!h.includes("</body>"))throw new Error("HTML base invalide");
    const rd=String(release.date||"").split("-"),displayDate=rd.length===3?(rd[2]+"/"+rd[1]+"/"+rd[0]):String(release.date||"—"),releaseLabel=release.label||("Alpha "+TARGET+" TEST");
    h=h.replace('<strong>Alpha 0.9.12</strong>MAJ 18/09/2026 · Paris','<strong>'+releaseLabel+'</strong>MAJ '+displayDate);
    h=h.replace('APP07 · Alpha 0.9.12 · MAJ 18/09/2026 · Paris','APP07 · '+releaseLabel+' · MAJ '+displayDate);
    h=h.replace('Alpha 0.9.12 · ergonomie · tampons A/B/C · conversions',releaseLabel+' · sélection multi-pages · configuration · traduction');
    h=h.replace('nLab PDF Studio · APP07 · Alpha 0.9.12 · dernière MAJ : 18/09/2026 · Paris.','nLab PDF Studio · APP07 · '+releaseLabel+' · dernière MAJ : '+displayDate+'.');
    const releaseTag='<script id="nlabPdfRelease">window.NLAB_PDF_RELEASE='+JSON.stringify(release).replace(/</g,"\\u003c")+';<\/script>';
    h=h.replace("</head>",releaseTag+"</head>");
    const parts=[];
    for(let i=1;i<=6;i++){
      const n=String(i).padStart(2,"0");
      parts.push(await fetchText("./runtime0914/app0914.part"+n+".txt","Runtime 0.9.14 part"+n));
    }
    const runtime=parts.join("");
    const rc2=await fetchText("./runtime0914/rc2-patch.js","Patch 0.9.14 RC2");
    const patch0915=await fetchText("./runtime0915/stamp-dates-filename.js","Patch 0.9.15 tampons");
    const patch0916=await fetchText("./runtime0916/stamp-auth-dss.js","Patch 0.9.16 tampons/auth/DSS");
    const profile0917=await fetchText("./runtime0917/profile.js","Patch 0.9.17 profil");
    const naming0917=await fetchText("./runtime0917/naming.js","Patch 0.9.17 nommage");
    const stampHelp0917=await fetchText("./runtime0917/stamp-help.js","Patch 0.9.17 aide tampons");
    const authGate0917=await fetchText("./runtime0917/auth-gate.js","Patch 0.9.17 accès signature privé");
    const variables0918=await fetchText("./runtime0918/variables.js","Patch 0.9.18 variables communes");
    const workspace0918=await fetchText("./runtime0918/workspace.js","Patch 0.9.18 workspace unique");
    const drive0918=await fetchText("./runtime0918/google-drive.js","Patch 0.9.18 Google Drive");
    const unified0919=await fetchText("./runtime0919/unified-config-auth.js","Patch 0.9.19 configuration/authentification");
    const patch0920=await fetchText("./runtime0920/ux-consolidation.js","Patch 0.9.20 consolidation UX");
    const sharedScope0921=await fetchText("../_shared/selection-scope.js","Brique commune portée/sélection");
    const sharedArchive0921=await fetchText("../_shared/archive-workspace.js","Brique commune archive ZIP");
    const pageScope0921=await fetchText("./runtime0921/page-scope.js","Patch 0.9.21 portée pages");
    const archive0921=await fetchText("./runtime0921/archive-workspace.js","Patch 0.9.21 workspace ZIP");
    const routing0921=await fetchText("./runtime0921/output-routing.js","Patch 0.9.21 routage sortie");
    const bilingual0922=await fetchText("./runtime0922/bilingual-translation.js","Patch 0.9.22 traduction bilingue BRK104");
    const functional0924=await fetchText("./runtime0924/functional-ui.js","Patch 0.9.24 interface fonctionnelle");
    const safePatch=(code,label)=>"try{\n"+code+"\n}catch(e){console.error('[nLab "+label+"]',e);window.__NLAB_PATCH_ERRORS__=window.__NLAB_PATCH_ERRORS__||[];window.__NLAB_PATCH_ERRORS__.push({label:"+JSON.stringify(label)+",message:String(e&&e.message||e)});}";
    const closeScript="</scr"+"ipt>";
    const marker="})();\n"+closeScript+'\n<script id="alpha0910Runtime">';
    if(!h.includes(marker))throw new Error("Point d’injection interne introuvable");
    h=h.replace(marker,
      "\n"+runtime+"\n"+rc2+
      "\n"+safePatch(patch0915,"0.9.15 tampons")+
      "\n"+safePatch(patch0916,"0.9.16 auth/DSS")+
      "\n"+safePatch(profile0917,"0.9.17 profil")+
      "\n"+safePatch(naming0917,"0.9.17 nommage")+
      "\n"+safePatch(stampHelp0917,"0.9.17 aide tampons")+
      "\n"+safePatch(authGate0917,"0.9.17 accès privé")+
      "\n"+safePatch(variables0918,"0.9.18 variables")+
      "\n"+safePatch(workspace0918,"0.9.18 workspace")+
      "\n"+safePatch(drive0918,"0.9.18 Drive")+
      "\n"+safePatch(unified0919,"0.9.19 configuration")+
      "\n"+safePatch(patch0920,"0.9.20 UX")+
      "\n"+safePatch(sharedScope0921,"BRK sélection")+
      "\n"+safePatch(sharedArchive0921,"BRK ZIP")+
      "\n"+safePatch(pageScope0921,"0.9.21 portée pages")+
      "\n"+safePatch(archive0921,"0.9.21 archive ZIP")+
      "\n"+safePatch(routing0921,"0.9.21 routage")+
      "\n"+safePatch(bilingual0922,"0.9.22 traduction")+
      "\n"+safePatch(functional0924,"0.9.24 interface fonctionnelle")+
      "\n})();\n"+closeScript+'\n<script id="alpha0910Runtime">');
    const debugTag='<script src="./runtime/app-0.9.13-debug.js"></scr'+'ipt>';
    h=h.replace("</body>",debugTag+"</body>");
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.getElementById("err").innerHTML='<div class="err"><b>Échec du chargement.</b><br>'+String(e.message||e).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</div>';
  }
})();
</script></body></html>
