<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab PDF Studio — Alpha 0.9.19 TEST</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#1f2933;margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(680px,calc(100% - 32px));background:#fff;border:1px solid #d7dde3;border-radius:14px;padding:26px;box-shadow:0 14px 40px #20304018}.bar{height:7px;background:#e5e9ed;border-radius:99px;overflow:hidden;margin:18px 0}.bar:before{content:"";display:block;width:45%;height:100%;background:#d39a35;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}.err{color:#8f251e;background:#fff1f0;border:1px solid #ebaaa4;padding:11px;border-radius:8px}</style></head><body><div class="box"><h2>nLab PDF Studio</h2><p>Chargement de <b>Alpha 0.9.19 TEST</b>…</p><div class="bar"></div><p>Configuration globale unique · workspace personnel unique · 5 dates visibles · variables communes · connexion Google dans le ruban.</p><div id="err"></div></div><script>
(async()=>{
  try{
    const fetchText=async(url,label)=>{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok)throw new Error(label+" : HTTP "+r.status);
      return r.text();
    };
    let h=await fetchText("./app-0.9.12.html","Base 0.9.12 inaccessible");
    if(!h.includes("</body>"))throw new Error("HTML base invalide");
    const runtimeTrap='<script>(function(){function mark(kind,msg){try{var a="data-nlab-runtime-"+kind;if(!document.documentElement.hasAttribute(a))document.documentElement.setAttribute(a,String(msg||"unknown").slice(0,240))}catch(_){}}window.addEventListener("error",function(e){mark("error",e.message)});window.addEventListener("unhandledrejection",function(e){mark("rejection",e.reason&&e.reason.message||e.reason)})})()<\/script>';
    h=h.replace("<head>","<head>"+runtimeTrap);
    // 0.9.19 consolidated runtime: stable 0.9.12 base + independent 0.9.18 services + 0.9.19 UI.
    // Legacy 0.9.14-0.9.17 patches remain archived but are intentionally not injected:
    // they relied on private lexical bindings across isolated IIFEs and could abort startup.
    const variables0918=await fetchText("./runtime0918/variables.js","Runtime 0.9.18 variables communes");
    const workspace0918=await fetchText("./runtime0918/workspace.js","Runtime 0.9.18 workspace unique");
    const drive0918=await fetchText("./runtime0918/google-drive.js","Runtime 0.9.18 Google Drive visible");
    const unified0919=await fetchText("./runtime0919/unified-config-auth.js","Runtime 0.9.19 configuration/authentification unifiées");
    const closeScript="</scr"+"ipt>";
    const marker="})();\n"+closeScript+'\n<script id="alpha0910Runtime">';
    if(!h.includes(marker))throw new Error("Point d’injection interne 0.9.14 introuvable");
    h=h.replace(marker,"\n"+variables0918+"\n"+workspace0918+"\n"+drive0918+"\n"+unified0919+"\n})();\n"+closeScript+'\n<script id="alpha0910Runtime">');
    const debugTag='<script src="./runtime/app-0.9.13-debug.js"></scr'+'ipt>';
    h=h.replace("</body>",debugTag+"</body>");
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.getElementById("err").innerHTML='<div class="err"><b>Échec du chargement.</b><br>'+String(e.message||e).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</div>';
  }
})();
</script></body></html>
