<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="nLab PDF Studio Alpha 0.9.8 — application PDF local-first publiée sur nLab Web.">
<title>nLab PDF Studio — Alpha 0.9.8</title>
<style>
:root{--blue:#0057b8;--ink:#1f2933;--muted:#65717d;--bg:#f3f5f7;--line:#d7dde3}
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(640px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 14px 40px #20304018}.box h2{margin:0 0 8px}.box p{color:var(--muted);line-height:1.5}.bar{height:7px;background:#e5e9ed;border-radius:99px;overflow:hidden;margin:18px 0}.bar:before{content:"";display:block;width:45%;height:100%;background:var(--blue);border-radius:inherit;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}.meta{font-size:12px;color:var(--muted)}.err{color:#8f251e;background:#fff1f0;border:1px solid #ebaaa4;padding:11px 12px;border-radius:8px;margin-top:14px;line-height:1.45}
</style>
</head>
<body>
<div class="box"><h2>nLab PDF Studio</h2><p>Chargement de la version publique <b>Alpha 0.9.8</b> depuis nLab Web…</p><div class="bar"></div><div class="meta">Runtime statique hébergé dans le même dépôt GitHub Pages · aucun chargement Google Drive au démarrage.</div><div id="err"></div></div>
<script src="./runtime/app098.part01.js"></script>
<script src="./runtime/app098.part02.js"></script>
<script src="./runtime/app098.part03.js"></script>
<script src="./runtime/app098.part04.js"></script>
<script src="./runtime/app098.part05.js"></script>
<script src="./runtime/app098.part06.js"></script>
<script src="./runtime/app098.part07.js"></script>
<script src="./runtime/app098.part08.js"></script>
<script src="./runtime/app098.part09.js"></script>
<script src="./runtime/app098.part10.js"></script>
<script src="./runtime/app098.part11.js"></script>
<script>
(async()=>{
  try{
    if(typeof DecompressionStream==='undefined') throw new Error('Navigateur trop ancien : DecompressionStream indisponible. Utilisez une version récente de Chrome, Edge, Firefox ou Safari.');
    const b64=window.__NLAB_PDF_098||'';
    if(!b64) throw new Error('Runtime Alpha 0.9.8 introuvable.');
    const bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('nLab PDF Studio')||!html.includes('Alpha 0.9.8')) throw new Error('Le runtime chargé ne correspond pas à Alpha 0.9.8.');
    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    const box=document.getElementById('err');
    if(box) box.innerHTML='<div class="err"><b>Échec du chargement.</b><br>'+String(error&&error.message||error)+'</div>';
  }
})();
</script>
</body>
</html>
