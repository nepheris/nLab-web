<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab PDF Studio — Alpha 0.9.15 TEST</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#f3f5f7;color:#1f2933;margin:0;min-height:100vh;display:grid;place-items:center}.box{width:min(680px,calc(100% - 32px));background:#fff;border:1px solid #d7dde3;border-radius:14px;padding:26px;box-shadow:0 14px 40px #20304018}.bar{height:7px;background:#e5e9ed;border-radius:99px;overflow:hidden;margin:18px 0}.bar:before{content:"";display:block;width:45%;height:100%;background:#d39a35;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:100%}}.err{color:#8f251e;background:#fff1f0;border:1px solid #ebaaa4;padding:11px;border-radius:8px}</style></head><body><div class="box"><h2>nLab PDF Studio</h2><p>Chargement de <b>Alpha 0.9.15 TEST</b>…</p><div class="bar"></div><p>Tampons 5 dates A/B/C/D · préfixe/suffixe de fichier · aperçu du nom final · signature privée/certificat · outils PDF avancés.</p><div id="err"></div></div><script>
(async()=>{
  try{
    const fetchText=async(url,label)=>{
      const r=await fetch(url,{cache:"no-store"});
      if(!r.ok)throw new Error(label+" : HTTP "+r.status);
      return r.text();
    };
    let h=await fetchText("./app-0.9.12.html","Base 0.9.12 inaccessible");
    if(!h.includes("</body>"))throw new Error("HTML base invalide");
    const parts=[];
    for(let i=1;i<=6;i++){
      const n=String(i).padStart(2,"0");
      parts.push(await fetchText("./runtime0914/app0914.part"+n+".txt","Runtime 0.9.14 part"+n));
    }
    const runtime=parts.join("");
    const rc2=await fetchText("./runtime0914/rc2-patch.js","Patch 0.9.14 RC2");
    const patch0915=await fetchText("./runtime0915/stamp-dates-filename.js","Patch 0.9.15 tampons");
    const closeScript="</scr"+"ipt>";
    const marker="})();\n"+closeScript+'\n<script id="alpha0910Runtime">';
    if(!h.includes(marker))throw new Error("Point d’injection interne 0.9.14 introuvable");
    h=h.replace(marker,"\n"+runtime+"\n"+rc2+"\n"+patch0915+"\n})();\n"+closeScript+'\n<script id="alpha0910Runtime">');
    const debugTag='<script src="./runtime/app-0.9.13-debug.js"></scr'+'ipt>';
    h=h.replace("</body>",debugTag+"</body>");
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.getElementById("err").innerHTML='<div class="err"><b>Échec du chargement.</b><br>'+String(e.message||e).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</div>';
  }
})();
</script></body></html>
