<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versions · nLab PDF Studio</title><style>body{font-family:system-ui,Arial;background:#f4f6f8;color:#1f2933;margin:0}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:18px;margin:12px 0}.current{border-color:#7fb590;background:#f4fbf6}.test{border-color:#e0b74c;background:#fff9e8}a{color:#0057b8;font-weight:700}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{font-size:11px;padding:4px 7px;border-radius:99px;font-weight:800}.badge.current{background:#eaf6ee;color:#21633a}.badge.test{background:#fff0b8;color:#765600}.badge.hist{background:#eef1f4;color:#53616d}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}</style></head><body><main class="wrap"><p><a href="./">← PDF Studio</a> · <a href="../../">nLab Web</a></p><h1>Versions de nLab PDF Studio</h1><p>La route <code>app.html</code> ouvre toujours la version CURRENT. Une version TEST peut être essayée séparément sans modifier la version stable.</p><div class="legend"><span class="badge current">CURRENT</span><span class="badge test">TEST / RC</span><span class="badge hist">HISTORIQUE</span></div><div id="list">Chargement…</div></main><script>fetch('./versions.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{document.getElementById('list').innerHTML=x.versions.map(v=>{const st=v.status|| (v.current?'current':'historical');const badge=st==='current'?'<span class="badge current">CURRENT</span>':st==='test'?'<span class="badge test">TEST / RC</span>':'<span class="badge hist">HISTORIQUE</span>';return `<article class="card ${st==='current'?'current':st==='test'?'test':''}"><div class="top"><h2>${v.label}</h2>${badge}</div><p>${v.date} · ${v.notes}</p><p><a href="${v.href}">${st==='test'?'Tester cette version':'Ouvrir cette version'} →</a></p></article>`}).join('')}).catch(()=>document.getElementById('list').textContent='Impossible de charger la liste des versions.');</script></body></html>
