<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versions · nLab PDF Studio</title><style>body{font-family:system-ui,Arial;background:#f4f6f8;color:#1f2933;margin:0}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:18px;margin:12px 0}.current{border-color:#7fb590;background:#f4fbf6}a{color:#0057b8;font-weight:700}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{font-size:11px;background:#eaf6ee;color:#21633a;padding:4px 7px;border-radius:99px}</style></head><body><main class="wrap"><p><a href="./">← PDF Studio</a> · <a href="../../">nLab Web</a></p><h1>Versions de nLab PDF Studio</h1><p>La route <code>app.html</code> ouvre toujours la dernière version publiée. Les liens ci-dessous permettent de tester une version précise.</p><div id="list">Chargement…</div></main><script>fetch('./versions.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{document.getElementById('list').innerHTML=x.versions.map(v=>`<article class="card ${v.current?'current':''}"><div class="top"><h2>${v.label}</h2>${v.current?'<span class="badge">CURRENT</span>':''}</div><p>${v.date} · ${v.notes}</p><p><a href="${v.href}">Ouvrir cette version →</a></p></article>`).join('')}).catch(()=>document.getElementById('list').textContent='Impossible de charger la liste des versions.');</script></body></html>
