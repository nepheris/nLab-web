<script>(async()=>{try{if(typeof DecompressionStream==='undefined')throw new Error('Navigateur trop ancien : DecompressionStream indisponible.');async function ungzipB64(b64){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}const baseB64=window.__NLAB_PDF_098||'';const patchB64=window.__NLAB_PDF_0911_PATCH||'';if(!baseB64)throw new Error('Runtime public 0.9.8 introuvable.');if(!patchB64)throw new Error('Patch public 0.9.11 introuvable.');const base=await ungzipB64(baseB64);const patch=JSON.parse(await ungzipB64(patchB64));const toks=base.split(/(?<=[;{}\n>])/);patch.sort((a,b)=>b[0]-a[0]).forEach(([i,n,s])=>toks.splice(i,n,...(s?[s]:[])));const html=toks.join('');if(!html.includes('Alpha 0.9.11')||!html.includes('alpha0911Runtime')||!html.includes('DATE_B')||!html.includes('notificationHub'))throw new Error('Contrôle de reconstruction Alpha 0.9.11 échoué.');document.open();document.write(html);document.close();}catch(e){console.error(e);const x=document.getElementById('err');if(x)x.innerHTML='<div class="err"><b>Échec du chargement.</b><br>'+String(e.message||e)+'</div>';}})();</script></body></html>
