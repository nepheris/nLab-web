<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Data Studio</title><link rel="stylesheet" href="../_shared/studio.css"></head><body><header><div class="wrap head"><a href="../studios/">← Studios</a><span class="brand">Data Studio</span></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Alpha POC · exploration</div><h1>Data Studio</h1><p class="lead">Aperçu CSV/JSON, profil des colonnes et conversion vers JSON. La version suivante branchera les moteurs DuckDB-Wasm et DataViz nLab.</p><div class="actions"><a class="btn" href="../../Library/demo/manifests/data.json">Manifest de test</a><a class="btn" href="../../Library/demo/">Galerie démo</a></div></section><section class="panel" style="margin-top:14px"><div class="toolbar"><input id="file" type="file" accept=".csv,.json"><button id="demoCsv">Démo CSV</button><button id="demoJson">Démo JSON</button><button id="save" class="primary">Exporter JSON</button></div><div id="profile" class="status">Aucune donnée.</div><div class="tablewrap" style="margin-top:10px"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></section></main><footer><div class="wrap foot">nLab Data Studio · Alpha POC</div></footer><script>
const $=id=>document.getElementById(id);let rows=[];function csv(t){const l=t.trim().split(/\r?\n/),h=l.shift().split(',');return l.map(x=>{const a=x.split(',');return Object.fromEntries(h.map((k,i)=>[k,a[i]??'']))})}function render(){const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];$('head').innerHTML='<tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr>';$('body').innerHTML=rows.slice(0,200).map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k]??'')+'</td>').join('')+'</tr>').join('');const prof=keys.map(k=>{const v=rows.map(r=>r[k]).filter(x=>x!==''&&x!=null);return k+': '+v.length+' valeurs, '+new Set(v.map(String)).size+' uniques'});$('profile').textContent=rows.length+' lignes · '+keys.length+' colonnes · '+prof.join(' | ')}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function load(url,type){const t=await fetch(url).then(r=>r.text());rows=type==='json'?JSON.parse(t):csv(t);if(!Array.isArray(rows))rows=[rows];render()}$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();rows=f.name.toLowerCase().endsWith('.json')?JSON.parse(t):csv(t);if(!Array.isArray(rows))rows=[rows];render()};$('demoCsv').onclick=()=>load('../../Library/demo/files/demo-input/Data/dataset-validation-complet.csv','csv');$('demoJson').onclick=()=>load('../../Library/demo/files/demo-input/Data/dataset-validation-complet.json','json');$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));a.download='nlab-data-export.json';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
