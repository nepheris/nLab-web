<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Data Studio</title><link rel="stylesheet" href="../_shared/studio.css"><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><script src="https://cdn.jsdelivr.net/npm/papaparse@5.7.0/papaparse.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
.dataTop{display:grid;grid-template-columns:1fr 320px;gap:12px;margin-top:12px}.dataTable td{max-width:260px;overflow:hidden;text-overflow:ellipsis}.dataTable th{cursor:pointer}.dataTable img{width:52px;height:32px;object-fit:cover;border-radius:4px;border:1px solid #d9e0e6}.swatch{display:inline-block;width:14px;height:14px;border:1px solid #9caab5;border-radius:3px;vertical-align:middle;margin-right:5px}.typeList{max-height:320px;overflow:auto}.typeRow{display:grid;grid-template-columns:1fr auto;gap:6px;padding:6px 0;border-bottom:1px solid #edf0f2;font-size:10px}.typeBadge{padding:2px 5px;border-radius:999px;background:#eef5fb;color:#0b5f98}.summaryGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.filterGrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-top:8px}@media(max-width:900px){.dataTop{grid-template-columns:1fr}.summaryGrid{grid-template-columns:repeat(2,1fr)}.filterGrid{grid-template-columns:1fr}}
</style></head><body data-studio="Data Studio" data-icon="data" data-status="TEST 2.0">
<main class="wrap"><section class="hero"><div><div class="eyebrow">CSV · JSON · exploration · typage</div><h1>Data Studio</h1><p class="lead">Prévisualisation, recherche, filtrage, tri et export de datasets structurés.</p></div><div class="actions"><a class="btn" href="../../Library/demo/manifests/data.json">Manifest Data</a><a class="btn" href="../../Library/demo/">Galerie démo</a></div></section>
<section class="panel"><div class="toolbar"><input id="file" type="file" accept=".csv,.tsv,.json,text/csv,application/json" hidden><button id="dataAddFiles" type="button">Ajouter fichier / dossier</button><select id="datasetFileSelect" title="Dataset actif"><option value="">Aucun dataset</option></select><button id="demoCsv">Dataset CSV complet</button><button id="demoJson">Dataset JSON complet</button><button type="button" data-advanced-studio="dataset-generator-studio">Dataset Generator</button></div>
<div class="filterGrid"><input id="searchAll" placeholder="Recherche globale…"><select id="filterColumn"><option value="">Toutes colonnes</option></select><input id="filterValue" placeholder="Filtre contient…"><select id="sortDirection"><option value="">Sans tri</option><option value="asc">A → Z</option><option value="desc">Z → A</option></select></div>
<div class="filterGrid"><select id="sortColumn"><option value="">Colonne de tri…</option></select><select id="csvDelimiter"><option value=";">Point-virgule ;</option><option value=",">Virgule ,</option><option value="\t">Tabulation</option><option value="|">Pipe |</option></select><label class="inlineCheck"><input id="csvBom" type="checkbox" checked> BOM UTF-8</label><div class="row"><button id="save" class="primary">JSON</button><button id="exportCsv">CSV</button><button id="exportXlsx">Excel XLSX</button></div></div>
<div id="summary" class="summaryGrid" style="margin-top:10px"></div></section>
<div class="dataTop"><section class="panel"><div class="sectionTitle"><h2>Aperçu tabulaire</h2><span id="shown" class="badge">0 ligne</span></div><div class="tablewrap" style="max-height:650px"><table class="dataTable"><thead id="head"></thead><tbody id="body"></tbody></table></div></section><aside class="panel"><div class="sectionTitle"><h2>Profil des colonnes</h2><span class="badge local">auto</span></div><div id="types" class="typeList"></div><div class="tip" style="margin-top:10px">Tri, filtre et exports restent locaux au navigateur.</div></aside></div></main>
<script type="module">
import{parseCsv,filterRows,sortRows,toCsv,workbookFromObjects,workbookBlob}from'../_shared/studio-v2/tabular-service.js';
import{downloadJson,downloadCsv,downloadBlob}from'../_shared/studio-v2/download-service.js';
const $=id=>document.getElementById(id);let rows=[],sourceName='',viewRows=[],datasetFiles=[],txnMute=false,viewTxnTimer=null,lastViewState=null;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function detect(vals){const v=vals.filter(x=>x!==''&&x!=null);if(!v.length)return'null';if(v.every(x=>typeof x==='boolean'||/^(true|false)$/i.test(String(x))))return'bool';if(v.every(x=>typeof x==='number'||(!isNaN(Number(x))&&String(x).trim()!=='')))return'number';if(v.every(x=>/^\d{4}-\d{2}-\d{2}(T|$)/.test(String(x))))return'date';if(v.every(x=>/^https?:\/\//i.test(String(x))))return'url';if(v.every(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(x))))return'email';if(v.some(x=>/^#[0-9a-f]{6}$/i.test(String(x))))return'color';return'text'}
function renderCell(k,v){if(v==null)return'<span class="muted">null</span>';const s=String(v);if(/^https?:\/\//i.test(s)){if(/\.(png|jpe?g|webp|gif|svg)(\?|$)/i.test(s))return'<a href="'+esc(s)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(s)+'" alt=""></a>';return'<a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a>'}if(/^#[0-9a-f]{6}$/i.test(s))return'<span class="swatch" style="background:'+esc(s)+'"></span>'+esc(s);return esc(s)}
function keys(){return[...new Set(rows.flatMap(r=>Object.keys(r||{})))]}
function syncSelectors(){const ks=keys();for(const id of ['filterColumn','sortColumn']){const sel=$(id),v=sel.value,first=id==='filterColumn'?'Toutes colonnes':'Colonne de tri…';sel.innerHTML='<option value="">'+first+'</option>'+ks.map(k=>'<option value="'+esc(k)+'">'+esc(k)+'</option>').join('');if(ks.includes(v))sel.value=v}}
function applyView(){viewRows=filterRows(rows,{query:$('searchAll').value,column:$('filterColumn').value,value:$('filterValue').value});if($('sortColumn').value&&$('sortDirection').value)viewRows=sortRows(viewRows,$('sortColumn').value,$('sortDirection').value);render()}
function render(){const ks=keys();$('head').innerHTML='<tr>'+ks.map(k=>'<th data-key="'+esc(k)+'">'+esc(k)+(k===$('sortColumn').value?($('sortDirection').value==='desc'?' ↓':' ↑'):'')+'</th>').join('')+'</tr>';$('body').innerHTML=viewRows.slice(0,250).map(r=>'<tr>'+ks.map(k=>'<td title="'+esc(r?.[k]??'')+'">'+renderCell(k,r?.[k])+'</td>').join('')+'</tr>').join('');$('shown').textContent=Math.min(viewRows.length,250)+' / '+viewRows.length+' filtrées · '+rows.length+' total';const profiles=ks.map(k=>{const vals=rows.map(r=>r?.[k]);return{k,type:detect(vals),unique:new Set(vals.filter(v=>v!=null&&v!=='').map(v=>String(v))).size,nulls:vals.filter(v=>v==null||v==='').length}});$('types').innerHTML=profiles.map(p=>'<div class="typeRow"><div><b>'+esc(p.k)+'</b><br><span class="muted">'+p.unique+' uniques · '+p.nulls+' nulls</span></div><span class="typeBadge">'+p.type+'</span></div>').join('');$('summary').innerHTML=[['Lignes',rows.length],['Affichées',viewRows.length],['Colonnes',ks.length],['Source',sourceName||'—']].map(([a,b])=>'<div class="kpi"><span>'+a+'</span><b title="'+esc(b)+'">'+esc(b)+'</b></div>').join('')}
function publishDataContext(source='data-studio'){const active=datasetFiles[Number($('datasetFileSelect').value)]||{name:sourceName};document.dispatchEvent(new CustomEvent('studio-v2:selection-change',{detail:{selection:rows.length?[active]:[],active:rows.length?active:null,scope:'dataset',kind:'data',meta:{sourceName,rows:rows.length,columns:keys().length,shown:viewRows.length},source}}))}
function snapshotData(){return{rows:structuredClone(rows),sourceName,search:$('searchAll').value,filterColumn:$('filterColumn').value,filterValue:$('filterValue').value,sortColumn:$('sortColumn').value,sortDirection:$('sortDirection').value}}
function restoreData(snap,source='undo-redo'){txnMute=true;rows=structuredClone(snap.rows||[]);sourceName=snap.sourceName||'';syncSelectors();$('searchAll').value=snap.search||'';$('filterColumn').value=snap.filterColumn||'';$('filterValue').value=snap.filterValue||'';$('sortColumn').value=snap.sortColumn||'';$('sortDirection').value=snap.sortDirection||'';applyView();lastViewState=snapshotData();publishDataContext(source);txnMute=false}
function pushDataTxn(label,before,after){document.dispatchEvent(new CustomEvent('studio-v2:transaction',{detail:{label,meta:{studio:'data-studio'},undo:()=>restoreData(before,'undo'),redo:()=>restoreData(after,'redo')}}))}
function queueViewTxn(label='Modifier la vue Data'){if(txnMute)return;clearTimeout(viewTxnTimer);viewTxnTimer=setTimeout(()=>{const after=snapshotData(),before=lastViewState;if(before&&JSON.stringify(before)!==JSON.stringify(after))pushDataTxn(label,before,after);lastViewState=after;publishDataContext('view')},220)}
function setRows(v,label,{record=true}={}){const before=record&&lastViewState?lastViewState:snapshotData();rows=Array.isArray(v)?v:(v?.records||[v]);sourceName=label;syncSelectors();applyView();const after=snapshotData();lastViewState=after;publishDataContext('dataset');if(record&&!txnMute&&JSON.stringify(before)!==JSON.stringify(after))pushDataTxn('Charger '+(label||'dataset'),before,after)}
function renderDatasetFiles(){$('datasetFileSelect').innerHTML='<option value="">Aucun dataset</option>'+datasetFiles.map((x,i)=>'<option value="'+i+'">'+esc(x.name)+(x.relativePath?' · '+esc(x.relativePath):'')+'</option>').join('');if(datasetFiles.length)$('datasetFileSelect').value=String(Math.max(0,datasetFiles.length-1))}
async function openDatasetFile(i){const x=datasetFiles[i];if(!x)return;const t=await x.file.text(),low=x.name.toLowerCase();setRows(low.endsWith('.json')?JSON.parse(t):parseCsv(t,{delimiter:low.endsWith('.tsv')?'\t':''}),x.name)}
async function addDatasetFiles(files){const ok=[...(files||[])].filter(f=>/\.(csv|tsv|json)$/i.test(f.name));for(const file of ok)datasetFiles.push({file,name:file.name,relativePath:file.webkitRelativePath||file.__relativePath||''});renderDatasetFiles();if(ok.length)await openDatasetFile(datasetFiles.length-1)}
async function load(url,type,label){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();setRows(type==='json'?JSON.parse(t):parseCsv(t),label)}
$('file').onchange=e=>addDatasetFiles(e.target.files);$('dataAddFiles').onclick=()=>document.dispatchEvent(new CustomEvent('studio-v2:action',{detail:{action:'open',source:'data-ui'}}));$('datasetFileSelect').onchange=()=>{if($('datasetFileSelect').value!=='')openDatasetFile(Number($('datasetFileSelect').value))};document.addEventListener('studio-v2:input-picked',e=>{if(e.detail?.studio==='data-studio')addDatasetFiles(e.detail.files)});
$('demoCsv').onclick=()=>load('../../Library/demo/Data/dataset-validation-complet.csv','csv','dataset-validation-complet.csv');$('demoJson').onclick=()=>load('../../Library/demo/Data/dataset-validation-complet.json','json','dataset-validation-complet.json');
['searchAll','filterColumn','filterValue','sortColumn','sortDirection'].forEach(id=>$(id).addEventListener(id.includes('Column')||id==='sortDirection'?'change':'input',()=>{applyView();queueViewTxn()}));
$('head').onclick=e=>{const th=e.target.closest('[data-key]');if(!th)return;const k=th.dataset.key;if($('sortColumn').value===k)$('sortDirection').value=$('sortDirection').value==='asc'?'desc':'asc';else{$('sortColumn').value=k;$('sortDirection').value='asc'}applyView();queueViewTxn('Trier '+k)};
$('save').onclick=()=>downloadJson(viewRows,'nlab-data-export.json');
$('exportCsv').onclick=()=>{const sep=$('csvDelimiter').value==='\t'?'\t':$('csvDelimiter').value;downloadCsv(toCsv(viewRows,{delimiter:sep,bom:false}),'nlab-data-export.csv',{bom:$('csvBom').checked})};
$('exportXlsx').onclick=()=>downloadBlob(workbookBlob(workbookFromObjects(viewRows),'xlsx'),'nlab-data-export.xlsx');
setRows([],'',{record:false});lastViewState=snapshotData();publishDataContext('ready');
</script><script>window.NLAB_SPECIALIZED_V2={"manifest":{"id":"data-studio","sourcePath":"APP-Applications/data-studio/v2/index.html","name":"Data Studio","subtitle":"CSV · JSON · tri · filtres · export","homeHref":"../../","studiosHref":"../studios/","inputPicker":{"accept":".csv,.tsv,.json,text/csv,application/json","multiple":true,"folders":true},"menus":[{"id":"home","label":"Accueil","scope":"core"},{"id":"tools","label":"Outils","scope":"studio"},{"id":"history","label":"Historique","scope":"core"},{"id":"help","label":"Aide","scope":"core"}],"ribbon":[{"id":"file","label":"Fichier","scope":"core","items":[{"id":"data-studio-open","action":"open","label":"Ouvrir","icon":"file","scope":"core","primary":true},{"id":"data-studio-demo","action":"demo","label":"Démo","icon":"command","scope":"core"},{"id":"data-studio-export","action":"export","label":"Exporter JSON","icon":"save","scope":"core"}]}],"capabilities":[{"id":"core.input.file-folder-drop","status":"test"},{"id":"data.collection.multi","status":"test"},{"id":"data.filter.sort","status":"stable"},{"id":"data.history.undo-redo","status":"test","engine":"studio-core.undo-redo"},{"id":"data.export.multi-format","status":"stable"},{"id":"data.fixture.handoff","status":"test"}]},"actions":{"open":"#file","demo":"#demoCsv","export":"#save"},"channel":"test"};</script><script type="module" src="../_shared/studio-v2/bootstrap-specialized.js"></script></body></html>
