<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Spreadsheet Studio</title><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>.sheetMain{display:grid;grid-template-columns:300px 1fr;gap:12px;padding:12px}.sheetPanel{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:12px}.sheetTable{overflow:auto;max-height:74vh}.sheetTable table{border-collapse:collapse;width:max-content;min-width:100%}.sheetTable th,.sheetTable td{border:1px solid #dde3e8;padding:5px;white-space:nowrap}.sheetTable th{background:#f3f6f8;position:sticky;top:0}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}@media(max-width:900px){.sheetMain{grid-template-columns:1fr}}</style></head><body>
<main class="sheetMain"><aside class="sheetPanel"><h3>Classeur</h3><input id="fileInput" type="file" accept=".xls,.xlsx,.ods,.csv,.tsv,.json"><label>Feuille</label><select id="sheetSelect"></select><label>Recherche</label><input id="search" placeholder="Rechercher dans la feuille…"><div id="status" class="statusBox">Prêt.</div><h3>CSV</h3><select id="delimiter"><option value=";">Point-virgule ;</option><option value=",">Virgule ,</option><option value="\t">Tabulation</option><option value="|">Pipe |</option></select><label class="inlineCheck"><input id="bom" type="checkbox" checked> BOM UTF-8</label><h3>Exports</h3><div class="row"><button id="exportCsv">CSV</button><button id="exportJson">JSON</button></div><div class="row"><button id="exportXlsx">XLSX</button><button id="exportOds">ODS</button></div></aside><section class="sheetPanel"><div class="viewerToolbar"><strong id="bookName">Nouveau classeur</strong><span class="spacer"></span><span id="dims">0 × 0</span></div><div id="tableWrap" class="sheetTable"></div></section></main>
<script type="module" src="./v2/v2-app.js"></script></body></html>
