<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Scan Studio</title><link rel="icon" href="../../assets/branding/nlab-favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script><style>
.scanMain{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:10px;padding:10px}.panel{background:#fff;border:1px solid var(--nlab-line);border-radius:12px;padding:10px}.drop{border:2px dashed #a6b7c4;border-radius:10px;padding:16px;text-align:center;background:#f8fafc;cursor:pointer}.drop.drag{border-color:var(--nlab-brand);background:#eef6fb}.pageList{display:grid;gap:6px;margin-top:8px}.pageItem{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;border:1px solid #dbe4ea;border-radius:8px;padding:6px}.pageItem.active{outline:2px solid var(--nlab-brand)}.pageItem img{width:54px;height:72px;object-fit:cover;background:#eee}.canvasWrap{display:grid;place-items:center;min-height:520px;background:#eef2f5;border-radius:10px;overflow:auto;padding:10px}.canvasWrap canvas{background:#fff;box-shadow:0 6px 22px #0002;max-width:100%;height:auto}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.toolbar{display:flex;gap:6px;flex-wrap:wrap}.statusBox{margin-top:8px}.ocrOut{width:100%;min-height:140px}.field{display:grid;gap:4px;margin:7px 0}@media(max-width:850px){.scanMain{grid-template-columns:1fr;padding:6px}.canvasWrap{min-height:360px}.controls{grid-template-columns:1fr 1fr}}@media(max-width:560px){.controls{grid-template-columns:1fr}.pageItem{grid-template-columns:48px 1fr auto}.canvasWrap{min-height:280px}}
</style></head><body>
<main class="scanMain">
<aside class="panel">
<h2>Acquisition</h2>
<div id="drop" class="drop" tabindex="0" role="button"><strong>Photos / images</strong><br><small>Glissez-déposez ou choisissez plusieurs pages.</small></div>
<input id="fileInput" type="file" accept="image/*" multiple hidden>
<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
<div class="toolbar"><button id="pickFiles" type="button">Choisir images / dossier / URL</button><button id="takePhoto" type="button">Prendre photo</button></div>
<h3>Pages</h3><div class="toolbar"><button id="selectAll" type="button">Tout sélectionner</button><button id="selectNone" type="button">Tout désélectionner</button></div><div id="pageList" class="pageList"></div><div class="toolbar"><button id="moveUp" type="button">↑ Monter</button><button id="moveDown" type="button">↓ Descendre</button><button id="removePage" type="button">Retirer</button></div><div class="toolbar"><button id="undoScan" type="button">↶ Annuler</button><button id="redoScan" type="button">↷ Rétablir</button><button id="resetLot" type="button">Réinitialiser le lot</button></div>
<hr>
<h3>Nettoyage</h3>
<div class="controls">
<button id="rotateLeft" type="button">↶ 90°</button><button id="rotateRight" type="button">↷ 90°</button>
<label class="field"><span>Deskew °</span><input id="deskew" type="range" min="-8" max="8" step="0.1" value="0"><small id="deskewVal">0°</small></label>
<label class="field"><span>Mode</span><select id="cleanupMode"><option value="original">Original</option><option value="gray">Gris</option><option value="document">Document contraste</option><option value="bw">Noir & blanc</option></select></label>
</div>
<button id="applyCleanup" type="button">Appliquer au rendu</button>
<hr>
<div class="toolbar"><button id="runOcr" type="button">OCR page</button><button id="runOcrSelection" type="button">OCR sélection</button><button id="runOcrDocument" type="button">OCR document</button><button id="exportPdf" class="primary" type="button">Créer PDF sélection</button></div><label class="checkboxField"><input id="searchablePdf" type="checkbox"><span>Ajouter une couche OCR recherchable au PDF (OCR automatique des pages sélectionnées si nécessaire)</span></label>
<label class="field"><span>Langue OCR</span><select id="ocrLang"><option value="auto">Auto FR/EN</option><option value="fra">Français</option><option value="eng">English</option><option value="fra+eng">FR + EN</option></select></label>
<div id="status" class="statusBox">Prêt.</div>
<textarea id="ocrOut" class="ocrOut" placeholder="Texte OCR de la page active…"></textarea>
</aside>
<section class="panel"><div class="toolbar"><strong id="pageTitle">Aucune page</strong><span style="flex:1"></span><button id="downloadPage" type="button">Exporter page PNG</button></div><div class="canvasWrap"><canvas id="canvas" width="900" height="1200"></canvas></div></section>
</main>
<script type="module" src="./v2/v2-app.js"></script></body></html>
