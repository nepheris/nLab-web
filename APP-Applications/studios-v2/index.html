<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Studios V2</title><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><style>
body{padding-bottom:0}.hub{width:min(1180px,calc(100% - 32px));margin:28px auto}.hero,.card{background:#fff;border:1px solid #dce3ea;border-radius:14px;padding:18px}.hero{margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.card h2{margin:5px 0}.card p{color:#667085;min-height:48px}.tag{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800}.tag.test{background:#fff3c8;color:#755800}.tag.dev{background:#fff8e8;color:#8a5a00}.actions{display:flex;gap:6px;flex-wrap:wrap}.pluginLegend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body>
<main class="hub"><section class="hero"><div class="eyebrow">nLab Studio Platform</div><h1>Studios V2</h1><p>Nouvelle architecture : un Studio Core V2 unique + plugins/add-ons métier. La V1 reste disponible comme référence/legacy pendant la migration.</p><div class="actions"><a class="btn" href="../studios/">Studios V1 / actuels</a><a class="btn" href="../../">nLab Web</a></div><div class="pluginLegend"><span class="tag test">TEST = exécutable</span><span class="tag dev">DÉVELOPPEMENT = migration non validée</span></div></section><section id="grid" class="grid"></section></main>
<script>
fetch('./catalog.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));document.querySelector('#grid').innerHTML=(d.studios||[]).map(s=>'<article class="card"><span class="tag '+(s.status==='test'?'test':'dev')+'">'+(s.status==='test'?'TEST':'DÉVELOPPEMENT')+' '+e(s.version)+'</span><h2>'+e(s.name)+'</h2><p>'+e(s.note)+'</p><div class="actions"><a class="btn '+(s.status==='test'?'primary':'')+'" href="'+e(s.href)+'">'+(s.status==='test'?'Ouvrir la V2':'Voir le Studio actuel')+'</a></div></article>').join('')});
</script></body></html>
