<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Code Studio</title><link rel="stylesheet" href="../_shared/studio.css"></head><body><header><div class="wrap head"><a href="../studios/">← Studios</a><span class="brand">Code Studio</span></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Alpha POC · éditeur</div><h1>Code Studio</h1><p class="lead">Éditeur local de fichiers texte/code avec ouverture, sauvegarde et quelques actions de base.</p><div class="actions"><a class="btn" href="../../Library/demo/manifests/code-json.json">Manifest de test</a><a class="btn" href="../../Library/demo/">Galerie démo</a></div></section><section class="panel" style="margin-top:14px"><div class="toolbar"><input id="file" type="file" accept=".txt,.md,.json,.js,.ts,.html,.css,.py,.sh,.sql,.yaml,.yml,.xml,.csv"><select id="lang"><option>auto</option><option>json</option><option>javascript</option><option>html</option><option>css</option><option>python</option><option>sql</option><option>markdown</option><option>yaml</option><option>xml</option></select><button id="demo">Charger démo JS</button><button id="format">Formater JSON</button><button id="save" class="primary">Télécharger</button></div><textarea id="editor" spellcheck="false" placeholder="Ouvre un fichier ou saisis du code…"></textarea><div id="status" class="status">Prêt.</div></section></main><footer><div class="wrap foot">nLab Code Studio · moteur d'édition POC</div></footer><script>
const $=id=>document.getElementById(id);let name='code-demo.txt';$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;name=f.name;$('editor').value=await f.text();$('status').textContent=f.name+' · '+f.size+' octets'};$('demo').onclick=async()=>{$('editor').value=await fetch('../../Library/demo/demo-input/Code/demo-script.js').then(r=>r.text());name='demo-script.js';$('lang').value='javascript'};$('format').onclick=()=>{try{$('editor').value=JSON.stringify(JSON.parse($('editor').value),null,2);$('status').textContent='JSON formaté.'}catch(e){$('status').textContent='JSON invalide : '+e.message}};$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('editor').value],{type:'text/plain;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)};</script></body></html>
