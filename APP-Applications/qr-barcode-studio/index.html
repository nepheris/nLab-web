<h1>QR & Barcode Studio</h1><p>Cette URL historique reste compatible. Ouverture de la version CURRENT sur Studio Core.</p>
<p><a id="currentStudioLink" href="./v2/?channel=current">Ouvrir QR & Barcode Studio</a></p>
