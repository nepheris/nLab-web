<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab PDF Sign — Versions</title><link rel="icon" href="../../assets/branding/nlab-favicon.svg" type="image/svg+xml"><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#1f2933}.wrap{width:min(900px,calc(100% - 28px));margin:32px auto}.card{background:#fff;border:1px solid #d9e0e6;border-radius:14px;padding:18px;margin:10px 0}.meta{color:#667582;font-size:12px}a{color:#1769aa}</style></head><body><main class="wrap"><h1>nLab PDF Sign — versions</h1><div id="list"></div><p><a href="./">Retour à PDF Sign</a></p></main><script type="module">import{resolveBuildMetadata}from'../_shared/studio-v2/build-metadata-service.js';const r=await fetch('./versions.json',{cache:'no-store'}),d=await r.json(),host=document.querySelector('#list');for(const v of d.versions||[]){const b=await resolveBuildMetadata({buildHref:'./build.json',sourcePath:'APP-Applications/pdf-sign/v1/index.html',fallback:{version:v.version,channel:v.status}});host.insertAdjacentHTML('beforeend','<article class="card"><b>'+v.label+'</b><p>'+v.notes+'</p><div class="meta">Canal '+String(v.status).toUpperCase()+(b.commitShort?' · commit '+b.commitShort:'')+(b.commitDate?' · '+new Date(b.commitDate).toLocaleString('fr-FR'):'')+'</div><p><a href="'+v.href+'?version='+encodeURIComponent(v.version)+'">Ouvrir</a></p></article>')}</script></body></html>
