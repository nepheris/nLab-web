<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Merge Studio</title><link rel="icon" type="image/svg+xml" href="../../assets/branding/nlab-favicon.svg"><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><style>
.mergeMain{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:10px;padding:10px}.panel{background:#fff;border:1px solid var(--nlab-line);border-radius:10px;padding:10px;box-shadow:var(--nlab-shadow-soft)}.mergeList{display:grid;gap:5px;max-height:52vh;overflow:auto;scrollbar-gutter:stable}.mergeItem{display:grid;grid-template-columns:28px minmax(0,1fr) 30px;gap:7px;align-items:center;border:1px solid #dce4ea;border-radius:7px;padding:6px;background:#fff}.mergeItem.active{outline:2px solid var(--nlab-brand)}.mergeItem strong,.mergeItem small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mergeItem small{font-size:8px;color:var(--nlab-muted)}.mergeItem button{width:28px;min-width:28px;height:28px;min-height:28px;padding:0}.mergeOrder{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;background:#eef5fb;color:#0b5f98;font-size:9px;font-weight:800}.toolbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.preview{min-height:520px;background:#eef2f5;border-radius:9px;display:grid;place-items:center;padding:10px;overflow:auto}.preview canvas{max-width:100%;height:auto;background:#fff;box-shadow:0 6px 22px #0002}.status{padding:7px;border:1px solid #dce4ea;border-radius:7px;background:#f8fafc;font-size:9px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.summary .kpi{border:1px solid #dce4ea;border-radius:7px;padding:7px}.summary span,.summary b{display:block}.summary span{font-size:8px;color:var(--nlab-muted)}@media(max-width:800px){.mergeMain{grid-template-columns:1fr;padding:6px}.preview{min-height:380px}.summary{grid-template-columns:1fr 1fr}} </style></head><body data-studio="Merge Studio" data-icon="merge" data-status="TEST">
<main class="mergeMain">
<section class="panel">
 <h2>Documents à fusionner</h2>
 <div class="toolbar"><button id="addMergeFiles" type="button">Ajouter</button><button id="clearMergeFiles" type="button">Tout retirer</button></div>
 <input id="mergeFilesNative" type="file" accept=".pdf,application/pdf" multiple hidden>
 <div id="mergeList" class="mergeList"></div>
 <div class="toolbar"><button id="moveMergeUp" type="button">↑ Monter</button><button id="moveMergeDown" type="button">↓ Descendre</button></div>
 <div class="summary"><div class="kpi"><span>Documents</span><b id="mergeFileCount">0</b></div><div class="kpi"><span>Pages</span><b id="mergePageCount">0</b></div><div class="kpi"><span>Taille</span><b id="mergeSize">0 Ko</b></div></div>
 <label>Nom de sortie<input id="mergeOutputName" value="fusion.pdf"></label>
 <button id="mergeNow" class="primary" type="button">Fusionner les PDF</button>
 <div id="mergeStatus" class="status">Ajoutez au moins deux PDF.</div>
 <div class="toolbar" style="margin-top:8px"><a class="btn" href="../pdf-studio/">Ouvrir PDF Studio avancé</a></div>
</section>
<section class="panel">
 <div class="sectionTitle"><h2>Aperçu</h2><span id="previewLabel" class="badge">Aucun document</span></div>
 <div class="preview"><canvas id="mergePreview" width="600" height="800"></canvas></div>
</section>
</main>
<script>window.NLAB_SPECIALIZED_V2={"manifest":{"id":"merge-studio","sourcePath":"APP-Applications/merge-studio/v1/index.html","name":"Merge Studio","subtitle":"Fusion PDF simple","homeHref":"../../","studiosHref":"../studios/","inputPicker":{"accept":".pdf,application/pdf","multiple":true,"folders":true},"menus":[{"id":"home","label":"Accueil","scope":"core"},{"id":"tools","label":"Outils","scope":"studio"},{"id":"help","label":"Aide","scope":"core"}],"ribbon":[{"id":"file","label":"Fichier","scope":"core","items":[{"id":"merge-studio-open","action":"open","label":"Ajouter","icon":"file","scope":"core","primary":true},{"id":"merge-studio-export","action":"export","label":"Fusionner","icon":"merge","scope":"studio"}]}],"capabilities":[{"id":"core.input.file-folder-drop","status":"test"},{"id":"pdf.merge","status":"stable"},{"id":"pdf.merge.reorder","status":"test"},{"id":"pdf.merge.preview","status":"test"}]},"actions":{"open":"#mergeFilesNative","export":"#mergeNow"},"channel":"test","versionsHref":"./versions.json","coreVersionHref":"../_shared/studio-v2/version.json","sourcePath":"APP-Applications/merge-studio/v1/index.html"};</script>
<script type="module" src="./v1/v1-app.js"></script><script type="module" src="../_shared/studio-v2/bootstrap-specialized.js"></script>
</body></html>
