<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab JSON Studio</title><link rel="stylesheet" href="../_shared/studio.css"></head><body><header><div class="wrap head"><a href="../studios/">← Studios</a><span class="brand">JSON Studio</span></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Alpha POC · JSON</div><h1>JSON Studio</h1><p class="lead">Validation, formatage, minification, tri récursif des clés et lecture d'un chemin simple.</p><div class="actions"><a class="btn" href="../../Library/demo/manifests/code-json.json">Manifest de test</a><a class="btn" href="../../Library/demo/">Galerie démo</a></div></section><div class="two"><section class="panel"><div class="toolbar"><input id="file" type="file" accept=".json,application/json"><button id="demo">Démo</button><button id="format">Formater</button><button id="min">Minifier</button><button id="sort">Trier clés</button><button id="save" class="primary">Exporter</button></div><textarea id="editor" spellcheck="false"></textarea></section><section class="panel"><h2>Inspection</h2><label>Chemin, ex. <span class="mono">records.0.nom</span></label><div class="row"><input id="path" value="records.0.nom"><button id="query">Lire</button></div><pre id="result" class="status mono" style="white-space:pre-wrap"></pre><div id="status" class="status">Prêt.</div></section></div></main><footer><div class="wrap foot">nLab JSON Studio · Alpha POC</div></footer><script>
const $=id=>document.getElementById(id);let name='data.json';function parse(){return JSON.parse($('editor').value)}function sorted(v){if(Array.isArray(v))return v.map(sorted);if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,sorted(v[k])]));return v}function ok(t){$('status').textContent=t}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;name=f.name;$('editor').value=await f.text();try{parse();ok('JSON valide.')}catch(x){ok('JSON invalide : '+x.message)}};$('demo').onclick=async()=>{$('editor').value=await fetch('../../Library/demo/files/demo-input/Code/demo-structure.json').then(r=>r.text());name='demo-structure.json';ok('Démo chargée.')};$('format').onclick=()=>{try{$('editor').value=JSON.stringify(parse(),null,2);ok('JSON valide et formaté.')}catch(e){ok('Erreur : '+e.message)}};$('min').onclick=()=>{try{$('editor').value=JSON.stringify(parse());ok('Minifié.')}catch(e){ok('Erreur : '+e.message)}};$('sort').onclick=()=>{try{$('editor').value=JSON.stringify(sorted(parse()),null,2);ok('Clés triées.')}catch(e){ok('Erreur : '+e.message)}};$('query').onclick=()=>{try{let v=parse();for(const p of $('path').value.split('.').filter(Boolean))v=v?.[/^\d+$/.test(p)?+p:p];$('result').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);ok('Chemin lu.')}catch(e){ok('Erreur : '+e.message)}};$('save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('editor').value],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)};</script></body></html>
