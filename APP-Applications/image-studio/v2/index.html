<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Image Studio</title><link rel="stylesheet" href="../_shared/studio.css"><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><style>
.imageWorkspace{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:10px;padding:10px}.panel{background:#fff;border:1px solid #d9e0e6;border-radius:10px;padding:10px}.imageList{display:grid;gap:5px;max-height:220px;overflow:auto}.imageItem{display:grid;grid-template-columns:42px minmax(0,1fr) 30px;gap:7px;align-items:center;border:1px solid #dce4ea;border-radius:7px;padding:5px}.imageItem.active{outline:2px solid #3282ca}.imageItem img{width:42px;height:42px;object-fit:cover;border-radius:4px}.imageItem strong,.imageItem small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.imageItem small{font-size:8px;color:#687784}.imageItem button{width:28px;height:28px;min-height:28px;padding:0}.toolbar,.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.canvasStage{position:relative;display:grid;place-items:center;min-height:560px;background:#eef2f5;border-radius:9px;overflow:auto;padding:10px}.canvasWrap{position:relative;display:inline-block}.canvasWrap canvas{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 6px 22px #0002}.cropOverlay{position:absolute;border:2px dashed #3282ca;background:#3282ca18;pointer-events:none}.cropOverlay[hidden]{display:none}.cropMode .canvasWrap canvas{cursor:crosshair}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.status{padding:7px;border:1px solid #dce4ea;border-radius:7px;background:#f8fafc;font-size:9px}.small{font-size:9px;color:#687784}.unitRow{display:grid;grid-template-columns:1fr 1fr 92px;gap:6px}.imageActions{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.imageActions button{min-height:38px}.cropActions{display:flex;gap:6px;flex-wrap:wrap}.cropActions button.active{background:#3282ca;color:#fff}.kpiRow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.kpi{border:1px solid #dce4ea;border-radius:7px;padding:6px}.kpi span,.kpi b{display:block}.kpi span{font-size:8px;color:#687784}.measureTable{max-height:180px;overflow:auto}@media(max-width:880px){.imageWorkspace{grid-template-columns:1fr;padding:6px}.canvasStage{min-height:360px}.kpiRow{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid2,.unitRow{grid-template-columns:1fr}.imageActions{grid-template-columns:1fr 1fr}.canvasStage{min-height:280px}}
</style></head><body data-studio="Image Studio" data-icon="image" data-status="TEST">
<main class="imageWorkspace">
<aside class="panel">
 <div class="sectionTitle"><h2>Images</h2><button id="openPicker" type="button">Ajouter</button></div>
 <input id="file" type="file" accept="image/*" multiple hidden>
 <div id="imageList" class="imageList"></div>
 <div class="toolbar"><button id="clearImages" type="button">Tout retirer</button><button id="demoSynthetic" type="button">Démo synthétique</button><button id="demoReal1" type="button">Démo réelle 1</button><button id="demoReal2" type="button">Démo réelle 2</button></div>
 <div id="collectionStatus" class="status">Aucune image.</div>
 <hr>
 <div class="sectionTitle"><h2>Édition</h2><button id="resetAll" type="button">Réinitialiser image</button></div>
 <div class="imageActions"><button id="left">↶ Rotation 90°</button><button id="right">↷ Rotation 90°</button><button id="flipX">↔ Miroir horizontal</button><button id="flipY">↕ Miroir vertical</button></div>
 <div class="unitRow"><label>Largeur<input id="w" type="number" min="1"></label><label>Hauteur<input id="h" type="number" min="1"></label><label>Unité<select id="dimensionUnit"><option value="px">px</option><option value="%">%</option><option value="pt">pt</option></select></label></div>
 <label class="small"><input id="ratio" type="checkbox" checked> Conserver le ratio</label>
 <div class="toolbar"><button id="resize">Redimensionner</button><button id="undoEdit">↶ Annuler dernière modification</button></div>
 <hr>
 <details open><summary><b>Recadrage</b></summary>
  <div class="cropActions"><button id="cropMouseMode" type="button">Sélection souris</button><button id="cropCancel" type="button">Annuler sélection</button><button id="cropApplySelection" type="button">Appliquer sélection</button></div>
  <div class="grid2"><input id="cropLeft" type="number" min="0" max="45" value="0" placeholder="Gauche %"><input id="cropRight" type="number" min="0" max="45" value="0" placeholder="Droite %"><input id="cropTop" type="number" min="0" max="45" value="0" placeholder="Haut %"><input id="cropBottom" type="number" min="0" max="45" value="0" placeholder="Bas %"></div>
  <button id="cropApply" type="button">Recadrer par valeurs</button>
 </details>
 <details><summary><b>Watermark</b></summary>
  <input id="watermarkText" placeholder="CONFIDENTIEL · {ID}"><div class="grid2"><select id="watermarkPosition"><option value="center">Centre</option><option value="top-left">Haut gauche</option><option value="top-right">Haut droite</option><option value="bottom-left">Bas gauche</option><option value="bottom-right">Bas droite</option></select><input id="watermarkOpacity" type="number" min="5" max="100" value="28"></div><div class="grid2"><input id="watermarkRotation" type="number" min="-180" max="180" value="-30"><button id="watermarkApply">Appliquer watermark</button></div>
 </details>
 <hr>
 <label>Format export<select id="fmt"><option value="source">Même format que la source</option><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label>
 <button id="export" class="primary">Exporter l’image active</button>
 <hr>
 <details><summary><b>Identification & empreinte</b></summary><div class="status" id="artifactIdentityStatus">Aucun identifiant.</div><div class="toolbar"><button id="artifactGenerate">Générer ID + SHA-256</button><button id="artifactEmbed">Inscrire ID invisible (PNG)</button><button id="artifactManifest">Manifest JSON</button></div></details>
 <hr>
 <details><summary><b>Mesure & calibration</b></summary>
  <div class="grid2"><label>Axe<select id="axis"><option>X</option><option>Y</option></select></label><label>Longueur réelle<input id="mm" type="number" step="0.1" value="50"></label></div>
  <div class="toolbar"><button id="measure" class="primary">＋ Mesure A → B</button><button id="undoMeasure">↶ Retirer dernière</button><button id="clear" class="danger">Réinitialiser mesures</button></div>
  <div class="kpiRow"><div class="kpi"><span>X px/mm</span><b id="kx">—</b></div><div class="kpi"><span>Y px/mm</span><b id="ky">—</b></div><div class="kpi"><span>DPI X</span><b id="dx">—</b></div><div class="kpi"><span>DPI Y</span><b id="dy">—</b></div></div>
  <div class="measureTable"><table><thead><tr><th>#</th><th>Axe</th><th>Pixels</th><th>mm</th><th>px/mm</th></tr></thead><tbody id="measureRows"></tbody></table></div><div id="cal" class="status">Aucune mesure.</div>
 </details>
</aside>
<section class="panel">
 <div class="sectionTitle"><h2>Aperçu</h2><span id="imageMeta" class="badge">Aucune image</span></div>
 <div id="canvasStage" class="canvasStage"><div id="canvasWrap" class="canvasWrap"><canvas id="cv" width="1000" height="700"></canvas><div id="cropOverlay" class="cropOverlay" hidden></div></div></div>
 <div class="toolbar"><span id="msg" class="small">Choisissez une image.</span></div>
</section>
</main>
<script type="module">
import{sha256,generateArtifactId,buildArtifactManifest,downloadManifest}from'../_shared/studio-v2/artifact-identity.js';
import{pxToUnit,unitToPx}from'../_shared/studio-v2/dimension-service.js';
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d'),overlay=$('cropOverlay'),stage=$('canvasStage');let items=[],active=-1,img=null,ratio=1,meas=[],measureMode=false,pts=[],cropMode=false,cropStart=null,cropRect=null,artifactId='',artifactManifest=null;
const state=()=>items[active]||null;
function fileToUrl(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function addFiles(files){for(const file of files||[]){if(!(file.type||'').startsWith('image/'))continue;const src=await fileToUrl(file);items.push({name:file.name,type:file.type||'image/png',src,originalSrc:src,history:[],relativePath:file.webkitRelativePath||file.__relativePath||''})}if(active<0&&items.length)active=0;renderList();loadActive()}
function renderList(){$('imageList').innerHTML=items.map((x,i)=>'<div class="imageItem '+(i===active?'active':'')+'"><img src="'+x.src+'" alt=""><div data-open-image="'+i+'"><strong>'+x.name+'</strong><small>'+(x.relativePath||x.type)+'</small></div><button type="button" data-remove-image="'+i+'" title="Retirer">×</button></div>').join('')||'<div class="status">Aucune image chargée.</div>';$('collectionStatus').textContent=items.length+' image(s)';$('imageList').onclick=e=>{const rm=e.target.closest('[data-remove-image]');if(rm){const i=Number(rm.dataset.removeImage);items.splice(i,1);if(active>=items.length)active=items.length-1;renderList();loadActive();return}const op=e.target.closest('[data-open-image]');if(op){active=Number(op.dataset.openImage);renderList();loadActive()}}}
function drawBase(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);if(img)ctx.drawImage(img,0,0,cv.width,cv.height);if(pts.length){ctx.save();ctx.fillStyle='#d22';ctx.strokeStyle='#d22';ctx.lineWidth=Math.max(2,cv.width/900);pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(5,cv.width/300),0,Math.PI*2);ctx.fill();ctx.font=Math.max(15,cv.width/70)+'px Arial';ctx.fillText(i?'B':'A',p.x+8,p.y-8)});if(pts.length===2){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);ctx.lineTo(pts[1].x,pts[1].y);ctx.stroke()}ctx.restore()}}
function loadActive(){const s=state();overlay.hidden=true;cropRect=null;cropMode=false;stage.classList.remove('cropMode');if(!s){img=null;ctx.clearRect(0,0,cv.width,cv.height);$('imageMeta').textContent='Aucune image';$('msg').textContent='Choisissez une image.';return}const i=new Image();i.onload=()=>{img=i;cv.width=i.naturalWidth;cv.height=i.naturalHeight;ratio=cv.width/cv.height;syncDimensions();$('imageMeta').textContent=cv.width+' × '+cv.height+' px';$('msg').textContent=s.name;drawBase()};i.src=s.src}
function syncDimensions(){const u=$('dimensionUnit').value,w=cv.width,h=cv.height;$('w').value=u==='%'?100:(u==='px'?Math.round(w):pxToUnit(w,u,{base:w}).toFixed(1));$('h').value=u==='%'?100:(u==='px'?Math.round(h):pxToUnit(h,u,{base:h}).toFixed(1))}
function px(v,axis){const u=$('dimensionUnit').value,base=axis==='w'?cv.width:cv.height;return Math.max(1,Math.round(unitToPx(Number(v)||(u==='%'?100:pxToUnit(base,u,{base})),u,{base})))}
function commitCanvas(name,type='image/png',quality=.95){const s=state();if(!s)return;s.history.push(s.src);s.src=cv.toDataURL(type,quality);s.name=name||s.name;renderList();loadActive()}
function transform(kind){if(!img)return;const t=document.createElement('canvas'),x=t.getContext('2d');if(kind==='left'||kind==='right'){t.width=cv.height;t.height=cv.width;x.translate(t.width/2,t.height/2);x.rotate((kind==='right'?1:-1)*Math.PI/2);x.drawImage(img,-cv.width/2,-cv.height/2)}else{t.width=cv.width;t.height=cv.height;x.translate(t.width/2,t.height/2);x.scale(kind==='flipX'?-1:1,kind==='flipY'?-1:1);x.drawImage(img,-cv.width/2,-cv.height/2)}cv.width=t.width;cv.height=t.height;ctx.drawImage(t,0,0);commitCanvas(state().name)}
$('left').onclick=()=>transform('left');$('right').onclick=()=>transform('right');$('flipX').onclick=()=>transform('flipX');$('flipY').onclick=()=>transform('flipY');
$('dimensionUnit').onchange=syncDimensions;$('w').oninput=()=>{if($('ratio').checked){const w=px($('w').value,'w'),h=Math.max(1,Math.round(w/ratio));if($('dimensionUnit').value==='px')$('h').value=h}};$('h').oninput=()=>{if($('ratio').checked){const h=px($('h').value,'h'),w=Math.max(1,Math.round(h*ratio));if($('dimensionUnit').value==='px')$('w').value=w}};
$('resize').onclick=()=>{if(!img)return;const w=px($('w').value,'w'),h=px($('h').value,'h'),t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').drawImage(img,0,0,w,h);cv.width=w;cv.height=h;ctx.drawImage(t,0,0);commitCanvas(state().name)};
$('undoEdit').onclick=()=>{const s=state();if(!s?.history?.length)return;const prev=s.history.pop();s.src=prev;renderList();loadActive()};
$('resetAll').onclick=()=>{const s=state();if(!s)return;s.history=[];s.src=s.originalSrc;renderList();loadActive()};
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height,cx:e.clientX-r.left,cy:e.clientY-r.top}}
$('cropMouseMode').onclick=()=>{cropMode=true;cropRect=null;overlay.hidden=true;stage.classList.add('cropMode');$('cropMouseMode').classList.add('active');$('msg').textContent='Tracez le rectangle de recadrage avec la souris.'};
$('cropCancel').onclick=()=>{cropMode=false;cropRect=null;cropStart=null;overlay.hidden=true;stage.classList.remove('cropMode');$('cropMouseMode').classList.remove('active');drawBase()};
cv.onpointerdown=e=>{if(measureMode){pts.push(point(e));drawBase();if(pts.length===2){measureMode=false;const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,dist=Math.hypot(dx,dy),mm=+$('mm').value,axis=$('axis').value;if(mm>0){meas.push({axis,px:dist,mm,ppm:dist/mm});renderCal()}$('msg').textContent='Mesure enregistrée.'}return}if(!cropMode)return;cropStart=point(e);cv.setPointerCapture?.(e.pointerId)};
cv.onpointermove=e=>{if(!cropMode||!cropStart)return;const p=point(e),r=cv.getBoundingClientRect(),x=Math.min(cropStart.cx,p.cx),y=Math.min(cropStart.cy,p.cy),w=Math.abs(p.cx-cropStart.cx),h=Math.abs(p.cy-cropStart.cy);overlay.hidden=false;Object.assign(overlay.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});cropRect={x:Math.min(cropStart.x,p.x),y:Math.min(cropStart.y,p.y),w:Math.abs(p.x-cropStart.x),h:Math.abs(p.y-cropStart.y)}};
cv.onpointerup=()=>{cropStart=null};
function applyCropRect(r){if(!img||!r||r.w<2||r.h<2)return;const t=document.createElement('canvas');t.width=Math.round(r.w);t.height=Math.round(r.h);t.getContext('2d').drawImage(img,Math.round(r.x),Math.round(r.y),Math.round(r.w),Math.round(r.h),0,0,t.width,t.height);cv.width=t.width;cv.height=t.height;ctx.drawImage(t,0,0);commitCanvas(state().name);$('cropCancel').click()}
$('cropApplySelection').onclick=()=>applyCropRect(cropRect);
$('cropApply').onclick=()=>{if(!img)return;const l=Math.max(0,Math.min(45,+$('cropLeft').value||0)),r=Math.max(0,Math.min(45,+$('cropRight').value||0)),t=Math.max(0,Math.min(45,+$('cropTop').value||0)),b=Math.max(0,Math.min(45,+$('cropBottom').value||0));applyCropRect({x:cv.width*l/100,y:cv.height*t/100,w:cv.width*(1-(l+r)/100),h:cv.height*(1-(t+b)/100)})};
$('watermarkApply').onclick=()=>{if(!img)return;const raw=$('watermarkText').value||'nLab {ID}',text=raw.replaceAll('{ID}',artifactId||'NO-ID'),op=Math.max(.05,Math.min(1,(+$('watermarkOpacity').value||28)/100)),angle=(+$('watermarkRotation').value||0)*Math.PI/180,pos=$('watermarkPosition').value,pad=Math.max(14,cv.width*.03),size=Math.max(18,Math.round(cv.width*.045));drawBase();ctx.save();ctx.globalAlpha=op;ctx.font='700 '+size+'px Arial';ctx.fillStyle='#111';ctx.textAlign=pos.includes('right')?'right':pos.includes('left')?'left':'center';ctx.textBaseline='middle';let x=pos.includes('right')?cv.width-pad:pos.includes('left')?pad:cv.width/2,y=pos.startsWith('top')?pad+size/2:pos.startsWith('bottom')?cv.height-pad-size/2:cv.height/2;ctx.translate(x,y);ctx.rotate(angle);ctx.fillText(text,0,0);ctx.restore();commitCanvas(state().name)};
$('fmt').onchange=()=>{};$('export').onclick=()=>{const s=state();if(!s||!img)return;const mime=$('fmt').value==='source'?(s.type||'image/png'):$('fmt').value,ext=(mime.split('/')[1]||'png').replace('jpeg','jpg'),a=document.createElement('a');drawBase();a.download=s.name.replace(/\.[^.]+$/,'')+'.'+ext;a.href=cv.toDataURL(mime,.92);a.click()};
$('measure').onclick=()=>{if(!img)return;measureMode=true;pts=[];$('msg').textContent='Cliquez A puis B.';drawBase()};function stats(a){const v=meas.filter(m=>m.axis===a).map(m=>m.ppm);if(!v.length)return null;const mean=v.reduce((x,y)=>x+y,0)/v.length,sd=Math.sqrt(v.reduce((s,x)=>s+(x-mean)**2,0)/v.length);return{n:v.length,mean,sd,dpi:mean*25.4}}function renderCal(){const x=stats('X'),y=stats('Y');$('kx').textContent=x?x.mean.toFixed(4):'—';$('ky').textContent=y?y.mean.toFixed(4):'—';$('dx').textContent=x?x.dpi.toFixed(1):'—';$('dy').textContent=y?y.dpi.toFixed(1):'—';$('measureRows').innerHTML=meas.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+m.axis+'</td><td>'+m.px.toFixed(2)+'</td><td>'+m.mm.toFixed(1)+'</td><td>'+m.ppm.toFixed(4)+'</td></tr>').join('');$('cal').textContent=(x?'X n='+x.n+' σ='+x.sd.toFixed(4):'')+(x&&y?' · ':'')+(y?'Y n='+y.n+' σ='+y.sd.toFixed(4):'')||'Aucune mesure.'}
$('undoMeasure').onclick=()=>{meas.pop();pts=[];renderCal();drawBase()};$('clear').onclick=()=>{meas=[];pts=[];renderCal();drawBase()};
$('artifactGenerate').onclick=async()=>{const s=state();if(!s)return;const blob=await (await fetch(s.src)).blob();artifactId=generateArtifactId('IMG');artifactManifest=await buildArtifactManifest({blob,id:artifactId,studio:'image-studio',studioVersion:document.body.dataset.studioVersion||'',source:s.name,operations:['current-image']});$('artifactIdentityStatus').textContent=artifactId+' · SHA-256 '+artifactManifest.sha256.slice(0,16)+'…'};
$('artifactEmbed').onclick=async()=>{if(!artifactId)await $('artifactGenerate').onclick();if(!artifactId)return;drawBase();const payload='NLABID:'+artifactId+'\0',bits=[];for(const ch of payload)for(let i=7;i>=0;i--)bits.push((ch.charCodeAt(0)>>i)&1);const im=ctx.getImageData(0,0,cv.width,cv.height);for(let i=0;i<bits.length&&i*4<im.data.length;i++)im.data[i*4]=(im.data[i*4]&254)|bits[i];ctx.putImageData(im,0,0);commitCanvas(state().name,'image/png');$('artifactIdentityStatus').textContent=artifactId+' · ID invisible inscrit'};
$('artifactManifest').onclick=()=>{if(artifactManifest)downloadManifest(artifactManifest,(state()?.name||'image').replace(/\.[^.]+$/,'')+'.manifest.json')};
$('openPicker').onclick=()=>document.dispatchEvent(new CustomEvent('studio-v2:action',{detail:{action:'open',source:'image-ui'}}));$('file').onchange=e=>addFiles(e.target.files);$('clearImages').onclick=()=>{items=[];active=-1;renderList();loadActive()};
document.addEventListener('studio-v2:input-picked',e=>{if(e.detail?.studio==='image-studio')addFiles(e.detail.files)});
async function addDemo(url,name){const blob=await fetch(url).then(r=>r.blob()),file=new File([blob],name,{type:blob.type||'image/png'});addFiles([file])}
$('demoSynthetic').onclick=()=>addDemo('../../Library/demo/Images/calibration-regles-300x150.png','calibration-regles-300x150.png');$('demoReal1').onclick=()=>addDemo('../../Library/demo/source-drive/images/calibration-scan-reel-01-public.webp','calibration-scan-reel-01-public.webp');$('demoReal2').onclick=()=>addDemo('../../Library/demo/source-drive/images/calibration-scan-reel-02-public.webp','calibration-scan-reel-02-public.webp');
renderList();renderCal();
</script>
<script>window.NLAB_SPECIALIZED_V2={"manifest":{"id":"image-studio","sourcePath":"APP-Applications/image-studio/v2/index.html","name":"Image Studio","subtitle":"Image · transformation · calibration","homeHref":"../../","studiosHref":"../studios/","inputPicker":{"accept":"image/*","multiple":true,"folders":true},"menus":[{"id":"home","label":"Accueil","scope":"core"},{"id":"tools","label":"Outils","scope":"studio"},{"id":"history","label":"Historique","scope":"core"},{"id":"help","label":"Aide","scope":"core"}],"ribbon":[{"id":"file","label":"Fichier","scope":"core","items":[{"id":"image-studio-open","action":"open","label":"Ouvrir","icon":"file","scope":"core","primary":true},{"id":"image-studio-demo","action":"demo","label":"Démo","icon":"command","scope":"core"},{"id":"image-studio-export","action":"export","label":"Exporter","icon":"save","scope":"core"}]}],"capabilities":[{"id":"core.input.file-folder-drop","status":"test"},{"id":"image.collection.multi","status":"test"},{"id":"image.transform.rotate","status":"stable"},{"id":"image.transform.flip","status":"stable"},{"id":"image.transform.resize","status":"stable"},{"id":"image.transform.crop","status":"test"},{"id":"image.transform.crop.mouse","status":"test"},{"id":"image.units.px-percent-pt","status":"test"},{"id":"image.history.undo-reset","status":"test"},{"id":"image.watermark.text","status":"test"},{"id":"image.calibration.measure","status":"test"},{"id":"image.identity.sha256","status":"test"}]},"actions":{"open":"#file","demo":"#demoSynthetic","export":"#export"},"channel":"test"};</script><script type="module" src="../_shared/studio-v2/bootstrap-specialized.js"></script></body></html>
