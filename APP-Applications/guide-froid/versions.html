<!doctype html><html data-gf-page="gf1" lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versions · Guide Froid Studio</title><link rel="stylesheet" href="./guide-froid-unified.css"></head><body><main><p class="nav"><a href="./">← Guide Froid</a><a href="../studios/">Tous les Studios</a></p><h1>Guide Froid · Versions</h1><p>La version CURRENT reste stable. La nouvelle version TEST se consulte séparément jusqu'à validation.</p><div class="buttons"><a class="btn" href="./index.html">Ouvrir CURRENT 0.6.1</a><a class="btn secondary" href="./test-integrated.html">Essayer TEST 1.1.0</a></div><div id="items"><article class="card"><h2>Versions</h2><p>Chargement du registre…</p></article></div><script>fetch("./versions.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{document.querySelector("#items").innerHTML=x.versions.map(v=>'<article class="card '+v.status+'"><span class="pill">'+v.status.toUpperCase()+'</span><h2>'+v.label+'</h2><p>'+v.notes+'</p><p><a href="'+v.href+'">Ouvrir cette version →</a></p><small>Version '+v.version+'</small></article>').join("")}).catch(()=>{document.querySelector("#items").innerHTML="<p>Le registre de versions est momentanément indisponible. Utilisez les liens directs ci-dessus.</p>"})</script></main><script src="./guide-test-nav.js" data-root="./" data-page="versions"></script></body></html>
