<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versions · Guide Froid Studio</title><link rel="stylesheet" href="../../assets/css/nlab-page-coherence.css"><style>body{margin:0;background:#f2f6fa;color:#1b3046;font-family:system-ui}main{max-width:960px;margin:32px auto;padding:15px}.card{background:#fff;border:1px solid #d7e3ee;border-radius:14px;padding:22px;margin:16px 0}.current{border-left:5px solid #33845a}.test{border-left:5px solid #d6a12d}.pill{border-radius:20px;background:#eaf0f6;padding:5px 11px;font-weight:700;font-size:12px}a{color:#0667a8;font-weight:650}.nav{display:flex;gap:20px;flex-wrap:wrap}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.btn{border-radius:8px;padding:12px 16px;background:#0c5385;color:white;text-decoration:none}.btn.secondary{background:#fff;color:#075386;border:1px solid #9ac5dc}small{color:#586e81}</style></head><body><main><p class="nav"><a href="./">← Guide Froid</a><a href="../studios/">Tous les Studios</a></p><h1>Guide Froid · Versions</h1><p>La version CURRENT reste stable. La nouvelle version TEST se consulte séparément jusqu'à validation.</p><div class="buttons"><a class="btn" href="./index.html">Ouvrir CURRENT 0.6.1</a><a class="btn secondary" href="./test-integrated.html">Essayer TEST 1.1.0</a></div><div id="items"><article class="card"><h2>Versions</h2><p>Chargement du registre…</p></article></div><script>fetch("./versions.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{document.querySelector("#items").innerHTML=x.versions.map(v=>'<article class="card '+v.status+'"><span class="pill">'+v.status.toUpperCase()+'</span><h2>'+v.label+'</h2><p>'+v.notes+'</p><p><a href="'+v.href+'">Ouvrir cette version →</a></p><small>Version '+v.version+'</small></article>').join("")}).catch(()=>{document.querySelector("#items").innerHTML="<p>Le registre de versions est momentanément indisponible. Utilisez les liens directs ci-dessus.</p>"})</script></main><script src="./guide-test-nav.js" data-root="./" data-page="versions"></script></body></html>
