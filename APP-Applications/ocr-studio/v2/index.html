<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab OCR Studio</title><link rel="icon" href="../../assets/branding/nlab-favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><script src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script><style>
.ocrMain{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:12px;padding:12px}.panel{background:#fff;border:1px solid var(--nlab-line);border-radius:12px;padding:12px}.drop{border:2px dashed #9fb5c7;border-radius:10px;padding:18px;text-align:center;background:#f8fbfd;cursor:pointer}.drop.drag{border-color:var(--nlab-brand);background:#eef7ff}.preview{display:grid;place-items:center;min-height:260px;background:#f3f5f7;border-radius:9px;overflow:auto}.preview img{max-height:520px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.engineGrid{display:grid;gap:6px}.engineRow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px;border:1px solid #dde5ea;border-radius:7px}.engineRow span:last-child{font-weight:700}.ocrOut{width:100%;min-height:520px;resize:vertical}.diag{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;background:#f7f9fb;border-radius:8px;padding:8px}.actions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:820px){.ocrMain{grid-template-columns:1fr;padding:7px}.ocrOut{min-height:340px}.grid2{grid-template-columns:1fr}}
</style></head><body>
<main class="ocrMain">
<section class="panel">
<h2>Entrée OCR</h2><div id="drop" class="drop" tabindex="0" role="button"><strong>Glissez une image</strong><br><small>ou cliquez pour choisir un fichier</small></div><input id="file" type="file" accept="image/*" hidden>
<div class="actions"><button id="demo" type="button">Démo imprimé</button><button id="noisy" type="button">Démo bruitée</button></div>
<div class="grid2">
<label class="field"><span>Moteur</span><select id="engine"></select></label>
<label class="field"><span>Langue</span><select id="lang"><option value="auto">Automatique FR/EN</option><option value="fra">Français</option><option value="eng">English</option><option value="fra+eng">Français + English</option></select></label>
</div>
<div class="actions"><button id="run" class="primary" type="button">Reconnaître</button><button id="save" type="button">Exporter TXT</button><button id="copy" type="button">Copier</button></div>
<div id="status" class="statusBox">Prêt.</div>
<div class="preview"><img id="preview" alt=""></div>
<h3>Engines</h3><div id="engineList" class="engineGrid"></div>
<details><summary>Diagnostics</summary><div id="diag" class="diag"></div></details>
</section>
<section class="panel"><h2>Texte reconnu</h2><textarea id="out" class="ocrOut" spellcheck="false" placeholder="Le texte OCR apparaîtra ici…"></textarea><div id="meta" class="statusBox">Aucun résultat.</div></section>
</main>
<script type="module" src="./v2/v2-app.js"></script></body></html>
