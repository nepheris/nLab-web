<!doctype html><html lang="fr"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Document Studio</title><link rel="stylesheet" href="../_shared/studio-v2/studio.css"><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>.docMain{display:grid;grid-template-columns:320px 1fr;gap:12px;padding:12px}.docPanel{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:12px}.docPanel textarea{width:100%;min-height:70vh}.previewDoc{background:#fff;max-width:850px;margin:auto;padding:28px;border:1px solid #d9e0e6;min-height:70vh;white-space:pre-wrap}.kpiRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}@media(max-width:900px){.docMain{grid-template-columns:1fr}}</style></head><body>
<main class="docMain"><aside class="docPanel"><h3>Source</h3><button id="openDocument" type="button">Ouvrir un document</button><input id="fileInput" type="file" accept=".doc,.docx,.odt,.rtf,.txt,.md,.markdown,.html,.htm"><div id="status" class="statusBox">Prêt.</div><h3>Recherche</h3><input id="search" placeholder="Rechercher…"><div class="kpiRow"><div class="kpi"><span>Mots</span><b id="words">0</b></div><div class="kpi"><span>Caractères</span><b id="chars">0</b></div><div class="kpi"><span>Lignes</span><b id="lines">0</b></div></div><h3>Export</h3><button id="exportTxt">TXT</button><button id="exportMd">Markdown</button><button id="exportHtml">HTML</button><button id="exportDocx">DOCX</button><button id="exportOdt">ODT</button><button id="printPdf">PDF navigateur</button></aside><section class="docPanel"><div class="viewerToolbar"><strong id="docName">nouveau.txt</strong><span class="spacer"></span><span id="formatBadge">TXT</span></div><textarea id="editor" spellcheck="true"></textarea><h3>Aperçu</h3><article id="preview" class="previewDoc"></article></section></main>
<script type="module" src="./v2/v2-app.js"></script></body></html>
