<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab File Studio</title><link rel="stylesheet" href="../_shared/studio.css"></head><body><header><div class="wrap head"><a href="../studios/">← Studios</a><span class="brand">File Studio</span></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Alpha POC · batch</div><h1>File Studio</h1><p class="lead">Prévisualiser des renommages en lot sans modifier silencieusement les fichiers originaux.</p><div class="actions"><a class="btn" href="../../Library/demo/manifests/file.json">Manifest de test</a><a class="btn" href="../../Library/demo/">Galerie démo</a></div></section><div class="two"><section class="panel"><h2>Entrée</h2><label>Fichiers</label><input id="files" type="file" multiple><label>Ou dossier</label><input id="folder" type="file" webkitdirectory multiple><h2 style="margin-top:16px">Règles</h2><label>Préfixe</label><input id="prefix" value="{DATE}_"><label>Suffixe</label><input id="suffix" value="_WEB"><label>Recherche regex</label><input id="find" placeholder="ex. ^IMG_"><label>Remplacer par</label><input id="repl" placeholder=""><label>Compteur initial</label><input id="start" type="number" value="1"><button id="demo" style="margin-top:10px">Charger noms de démo</button><button id="export" class="primary" style="margin-top:10px">Exporter le manifest CSV</button></section><section class="panel"><h2>Prévisualisation</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>Source</th><th>Destination</th><th>Dossier relatif</th></tr></thead><tbody id="body"></tbody></table></div><div id="status" class="status" style="margin-top:10px">Aucun fichier.</div></section></div></main><footer><div class="wrap foot">nLab File Studio · Alpha POC</div></footer><script>
const $=id=>document.getElementById(id);let items=[];const pad=n=>String(n).padStart(3,'0'),date=()=>new Date().toISOString().slice(0,10);
function split(n){const i=n.lastIndexOf('.');return i>0?[n.slice(0,i),n.slice(i)]:[n,'']}
function token(s,i){return s.replaceAll('{DATE}',date()).replaceAll('{YEAR}',date().slice(0,4)).replaceAll('{MONTH}',date().slice(5,7)).replaceAll('{COUNTER}',pad(+$('start').value+i))}
function target(it,i){let [stem,ext]=split(it.name);try{if($('find').value)stem=stem.replace(new RegExp($('find').value,'g'),$('repl').value)}catch{}return token($('prefix').value,i)+stem+token($('suffix').value,i)+ext}
function render(){const b=$('body');b.innerHTML=items.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+esc(target(x,i))+'</td><td>'+esc(x.rel||'')+'</td></tr>').join('');$('status').textContent=items.length+' élément(s) · prévisualisation uniquement';}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function load(fs){items=[...fs].map(f=>({name:f.name,rel:f.webkitRelativePath||''}));render()}$('files').onchange=e=>load(e.target.files);$('folder').onchange=e=>load(e.target.files);['prefix','suffix','find','repl','start'].forEach(id=>$(id).oninput=render);
$('demo').onclick=async()=>{const j=await fetch('../../Library/demo/manifests/file.json').then(r=>r.json());items=(j.demoNames||[]).map(n=>({name:n,rel:'demo-folder/'}));render()};
$('export').onclick=()=>{const rows=[['source','destination','relative_path'],...items.map((x,i)=>[x.name,target(x,i),x.rel])];const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nlab-file-studio-manifest.csv';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
