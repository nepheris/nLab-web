<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Versions · nLab Studio</title><style>
body{font-family:system-ui,Arial;background:#f4f6f8;color:#1f2933;margin:0}.wrap{width:min(900px,calc(100% - 32px));margin:40px auto}.card{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:18px;margin:12px 0}.current{border-color:#7fb590;background:#f4fbf6}.test{border-color:#e0b74c;background:#fff9e8}a{color:#0057b8;font-weight:700}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.badge{font-size:11px;padding:4px 7px;border-radius:99px;font-weight:800}.badge.current{background:#eaf6ee;color:#21633a}.badge.test{background:#fff0b8;color:#765600}.badge.hist{background:#eef1f4;color:#53616d}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-block;padding:9px 12px;border:1px solid #b8c6d1;border-radius:8px;text-decoration:none;background:#fff}.btn.primary{background:#0057b8;border-color:#0057b8;color:#fff}.btn.test{background:#fff7d6;border-color:#e1bd43;color:#765600}</style></head><body><main class="wrap"><p><a href="./">← <span id="studioNameBack">Studio</span></a> · <a href="../studios/">Tous les Studios</a> · <a href="../../">nLab Web</a></p><h1 id="pageTitle">Versions</h1><p>La version CURRENT est la version active. Une version TEST peut être essayée séparément sans modifier la CURRENT.</p><div id="quickLinks" class="actions"></div><div class="legend"><span class="badge current">CURRENT</span><span class="badge test">TEST / RC</span><span class="badge hist">HISTORIQUE</span></div><div id="list">Chargement…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('./versions.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(x=>{
  const app=x.name||x.app||document.title.replace(/^Versions · /,'')||'nLab Studio';
  document.title='Versions · '+app;
  document.getElementById('pageTitle').textContent='Versions de '+app;
  document.getElementById('studioNameBack').textContent=app;
  const by=new Map((x.versions||[]).map(v=>[String(v.version),v]));
  const cur=x.current?by.get(String(x.current)):null,test=x.test?by.get(String(x.test)):null;
  const quick=[];
  if(cur)quick.push('<a class="btn primary" href="'+esc(cur.href||'./')+'">CURRENT '+esc(cur.version)+'</a>');
  else quick.push('<span class="btn" style="opacity:.55">CURRENT —</span>');
  if(test)quick.push('<a class="btn test" href="'+esc(test.href||'./')+'">TEST '+esc(test.version)+'</a>');
  else quick.push('<span class="btn" style="opacity:.55">TEST —</span>');
  document.getElementById('quickLinks').innerHTML=quick.join('');
  document.getElementById('list').innerHTML=(x.versions||[]).map(v=>{
    const st=v.status||(v.current?'current':'historical');
    const badge=st==='current'?'<span class="badge current">CURRENT</span>':st==='test'?'<span class="badge test">TEST / RC</span>':'<span class="badge hist">HISTORIQUE</span>';
    return '<article class="card '+(st==='current'?'current':st==='test'?'test':'')+'"><div class="top"><h2>'+esc(v.label||v.version)+'</h2>'+badge+'</div><p>'+esc(v.date||'')+' · '+esc(v.notes||'')+'</p><p><a href="'+esc(v.href||'./')+'">'+(st==='test'?'Tester cette version':'Ouvrir cette version')+' →</a></p></article>'
  }).join('')||'<p>Aucune version enregistrée.</p>';
}).catch(()=>document.getElementById('list').textContent='Impossible de charger la liste des versions.');
</script></body></html>
