<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Studio · Versions</title><link rel="stylesheet" href="../_shared/studio-v1/studio.css"><style>
body{background:#f4f6f8}.versionsWrap{width:min(1100px,calc(100% - 32px));margin:32px auto 72px}.versionsHead{display:flex;align-items:center;gap:10px;margin-bottom:18px}.versionsHead h1{margin:0;font-size:30px}.versionsHead .grow{flex:1}.versionSummary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.versionHero,.versionRow{background:#fff;border:1px solid #d9e0e6;border-radius:12px;padding:16px}.versionHero.current{border-color:#b8ddc3;background:#f3fbf5}.versionHero.test{border-color:#e0b74c;background:#fff9e8}.versionHero.empty{opacity:.75}.versionHero h2{margin:5px 0 8px}.versionHero p{color:#596875;line-height:1.5}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.08em}.versionList{display:grid;gap:8px;margin-top:18px}.versionRow{display:grid;grid-template-columns:220px 1fr auto;gap:14px;align-items:center}.versionRow strong{display:block}.versionRow small{display:block;color:#74818c;margin-top:3px}.versionRow p{margin:0;color:#596875;line-height:1.45}.status{display:inline-block;font-size:9px;font-weight:900;padding:2px 6px;border-radius:999px;margin-right:6px}.status.current{background:#eaf6ee;color:#245c36}.status.test{background:#fff0b8;color:#765600}.status.historical{background:#edf1f4;color:#596875}@media(max-width:760px){.versionSummary{grid-template-columns:1fr}.versionRow{grid-template-columns:1fr}}
