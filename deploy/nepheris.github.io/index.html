<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="nLab — accès direct aux applications publiques nLab Web.">
<title>nLab</title>
<link rel="icon" href="https://nepheris.github.io/nLab-web/assets/branding/nlab-favicon.svg" type="image/svg+xml">
<style>
:root{--blue:#3282ca;--ink:#25313a;--muted:#687784;--line:#dce4ea;--bg:#f4f7f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
main{width:min(760px,calc(100% - 30px));background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 18px 60px #20304018}
.logo{width:150px;height:auto}.eyebrow{margin-top:28px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
h1{font-size:clamp(32px,6vw,54px);margin:8px 0 12px}.lead{font-size:18px;line-height:1.55;color:#52636f}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;padding:11px 15px;border:1px solid #bac8d2;border-radius:9px;text-decoration:none;color:inherit;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
small{display:block;margin-top:28px;color:var(--muted)}
</style>
</head>
<body><main>
<img class="logo" src="https://nepheris.github.io/nLab-web/assets/branding/nlab-wordmark.svg" alt="nLab">
<div class="eyebrow">Public · Applications nLab</div>
<h1>Accéder à nLab Web</h1>
<p class="lead">Portail public des nLab Studios, applications et jeux de démonstration.</p>
<div class="actions">
<a class="btn primary" href="https://nepheris.github.io/nLab-web/">nLab Web</a>
<a class="btn" href="https://nepheris.github.io/nLab-web/APP-Applications/studios/">nLab Studios</a>
<a class="btn" href="https://nepheris.github.io/nLab-web/APP-Applications/pdf-studio/">PDF Studio</a>
</div>
<small>nLab · Synergies SVA SARL</small>
</main></body></html>
