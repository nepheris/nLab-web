<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>nLab Icon Library</title><style>
:root{--fg:#fff;--bg:#3282ca;--ink:#1f2933;--muted:#667786;--line:#d8e0e7;--page:#f3f5f7}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--page);color:var(--ink)}.wrap{width:min(1400px,calc(100% - 28px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}header .wrap{min-height:64px;display:flex;align-items:center;gap:12px}.brand{margin-left:auto;font-weight:900;color:#0057b8}main{padding:24px 0 60px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.controls label{display:grid;gap:4px;font-size:12px}.controls input,.controls select{min-height:34px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.preview{height:115px;background:var(--bg);color:var(--fg);display:grid;place-items:center}.preview svg{width:54px;height:54px;color:inherit}.body{padding:10px}.body b{font-size:13px}.meta{font-size:10px;color:var(--muted);margin-top:5px}.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.tag{font-size:9px;background:#eef3f7;border-radius:999px;padding:2px 5px}.planned{outline:2px dashed #c79b29;outline-offset:-2px}.hidden{display:none!important}.familyTitle{display:flex;align-items:center;gap:8px}.count{font-size:11px;background:#eef3f7;padding:3px 7px;border-radius:999px}
</style></head><body><header><div class="wrap"><a href="../../../../">← Galerie démo</a><span class="brand">nLab ICON LIBRARY</span></div></header><main class="wrap">
<section class="panel"><h1>Bibliothèque iconographique nLab</h1><p>Référence canonique des icônes Studios, fonctions, types de fichiers, UI et symbologies.</p><div class="controls"><label>Recherche<input id="q" placeholder="Nom, tag, usage…"></label><label>Famille<select id="family"><option value="">Toutes</option></select></label><label>Statut<select id="status"><option value="">Tous</option><option value="active">Actif</option><option value="planned">Planifié</option></select></label><label>Icône<input id="fg" type="color" value="#ffffff"></label><label>Fond<input id="bg" type="color" value="#3282ca"></label></div><p><a href="../docs/mini-charte-iconographique-nlab.md">Mini-charte</a> · <a href="../docs/icon-generation-prompt.md">Prompt génération/audit</a> · <a href="../manifests/index.json">Index JSON global</a></p></section>
<div id="families"></div></main><script>
const qEl=document.getElementById('q'),familyEl=document.getElementById('family'),statusEl=document.getElementById('status'),fgEl=document.getElementById('fg'),bgEl=document.getElementById('bg'),familiesEl=document.getElementById('families');
const root='../',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let all=[];async function boot(){const idx=await fetch('../manifests/index.json').then(r=>r.json());familyEl.innerHTML+=[...idx.families].map(f=>'<option value="'+f.id+'">'+esc(f.label)+' ('+f.count+')</option>').join('');for(const f of idx.families){const m=await fetch('../manifests/'+f.id+'.json').then(r=>r.json());for(const i of m.icons)all.push({...i,familyLabel:m.label})}await render()}
async function render(){const query=qEl.value.trim().toLowerCase(),fam=familyEl.value,st=statusEl.value;const list=all.filter(i=>(!fam||i.family===fam)&&(!st||i.status===st)&&(!query||JSON.stringify([i.id,i.label,i.description,i.tags,i.usage,i.aliases]).toLowerCase().includes(query)));const groups=Object.groupBy?Object.groupBy(list,x=>x.family):list.reduce((a,x)=>((a[x.family]??=[]).push(x),a),{});familiesEl.innerHTML='';for(const [name,items] of Object.entries(groups)){const sec=document.createElement('section');sec.className='panel';sec.innerHTML='<h2 class="familyTitle">'+esc(items[0]?.familyLabel||name)+' <span class="count">'+items.length+'</span></h2><div class="grid"></div>';familiesEl.appendChild(sec);const grid=sec.querySelector('.grid');const svgs=await Promise.all(items.map(i=>fetch('../'+i.file.replace(/^\.\.\//,'')).then(r=>r.text())));grid.innerHTML=items.map((i,n)=>'<article class="card '+(i.status==='planned'?'planned':'')+'"><a class="preview" href="../'+i.file.replace(/^\.\.\//,'')+'" target="_blank">'+svgs[n]+'</a><div class="body"><b>'+esc(i.label)+'</b><div class="meta"><code>'+esc(i.id)+'</code><br>'+esc(i.description||'')+'<br><b>Usage :</b> '+esc((i.usage||[]).join(', ')||'—')+'</div><div class="tags">'+(i.tags||[]).slice(0,8).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div></article>').join('')}syncColors()}
function syncColors(){document.documentElement.style.setProperty('--fg',fgEl.value);document.documentElement.style.setProperty('--bg',bgEl.value)}
[qEl,familyEl,statusEl].forEach(x=>x.addEventListener(x.tagName==='SELECT'?'change':'input',render));fgEl.oninput=syncColors;bgEl.oninput=syncColors;boot();
</script></body></html>
