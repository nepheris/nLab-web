name: Studios History Preflight
on:
  pull_request:
    paths:
      - 'APP-Applications/studios/catalog.json'
      - 'APP-Applications/**/versions.json'
      - 'tests/studio-version-history.mjs'
      - 'tests/fixtures/studios-preservation-baseline.json'
      - 'tests/studios-preservation-gate.mjs'
      - 'tests/studio-version-resolver.mjs'
      - 'APP-Applications/_shared/studio-v2/version-service.js'
      - 'tests/studio-core-undo-redo.mjs'
      - 'tests/studio-core-colors.mjs'
      - 'APP-Applications/_shared/studio-v2/color-picker.js'
      - 'tests/studio-core-*.mjs'
      - 'APP-Applications/_shared/studio-v2/studio.css'
      - 'APP-Applications/_shared/studio-v2/window-system.js'
      - 'APP-Applications/_shared/studio-v2/viewer-control.js'
      - 'APP-Applications/_shared/studio-v2/input-picker.js'
      - 'APP-Applications/_shared/studio-v2/undo-redo.js'
      - '.github/workflows/studios-history-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all Studio version registry entries without browser
        env:
          NLAB_PREFLIGHT_ONLY: '1'
          NLAB_MIN_STUDIO_VERSIONS: '130'
        run: node tests/studio-version-history.mjs

      - name: Core Undo/Redo transaction tests
        run: node tests/studio-core-undo-redo.mjs

      - name: Core color conversion unit tests
        run: node tests/studio-core-colors.mjs

      - name: Core source and test syntax
        run: |
          for file in APP-Applications/_shared/studio-v2/{input-picker,viewer-control,window-system,undo-redo,color-picker}.js tests/studio-core-*.mjs; do
            node --check "$file"
          done

      - name: Verify Studio version resolver contract
        run: node tests/studio-version-resolver.mjs

      - name: Preserve all historical routes and CURRENT pointers
        run: node tests/studios-preservation-gate.mjs
