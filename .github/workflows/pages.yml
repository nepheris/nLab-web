name: Deploy nLab Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Publish CURRENT PDF Studio
        env:
          PDF_STUDIO_DRIVE_ID: 1WZhSyYL7SodG4hwmeRYGKulhI-fbrTZs
        run: |
          mkdir -p _site/APP-Applications/pdf-studio
          curl --fail --location --retry 3 \
            "https://drive.google.com/uc?export=download&id=${PDF_STUDIO_DRIVE_ID}" \
            --output _site/APP-Applications/pdf-studio/app.html
          grep -q "nLab PDF Studio" _site/APP-Applications/pdf-studio/app.html
          test -s _site/APP-Applications/pdf-studio/app.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
