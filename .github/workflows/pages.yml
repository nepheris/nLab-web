name: Publish nLab Web to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Info/**'
      - 'APP-Applications/**'
      - 'Library/demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PDF Studio public runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'Alpha 0.9.12' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'archivePattern0912' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'DATAMATRIX' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'treeCompare0912' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'nlabDemoCorpusV2' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q '../../Library/demo/demo-manifest.json' APP-Applications/pdf-studio/app-0.9.12.html
          for i in $(seq 1 11); do
            n=$(printf '%02d' "$i")
            test -s "APP-Applications/pdf-studio/runtime/app098.part${n}.js"
          done
          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          grep -q '"test": "0.9.12"' APP-Applications/pdf-studio/versions.json

      - name: Build shared nLab demo corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow reportlab python-docx openpyxl
          python Library/demo/generate_demo.py --output Library/demo
          test -s Library/demo/nLab-DEMO-CORPUS-v2.zip
          test -s Library/demo/demo-manifest.json
          test -s Library/demo/demo-catalog-v2.json
          python -m zipfile -t Library/demo/nLab-DEMO-CORPUS-v2.zip
          grep -q '"privacy": "synthetic-only"' Library/demo/demo-manifest.json
          grep -q '"fileCount": 39' Library/demo/demo-manifest.json
          echo 'nLab DEMO CORPUS v2 generated: OK'

      - name: Publish main and generated corpus to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nLab deployment bot'
          git config user.email 'noreply@users.noreply.github.com'
          git add -f Library/demo/nLab-DEMO-CORPUS-v2.zip Library/demo/demo-manifest.json Library/demo/demo-catalog-v2.json
          git commit -m 'build: generate public nLab demo corpus v2 [skip ci]' || true
          git push --force origin HEAD:gh-pages
