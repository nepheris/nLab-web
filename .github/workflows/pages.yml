name: Publish nLab Web to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Info/**'
      - 'APP-Applications/**'
      - 'Library/demo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PDF Studio public runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'Alpha 0.9.12' APP-Applications/pdf-studio/app-0.9.12.html
          test -s APP-Applications/pdf-studio/app-0.9.14.html
          test -s APP-Applications/pdf-studio/runtime/app-0.9.13-debug.js
          test -s APP-Applications/pdf-studio/runtime0914/loader.js
          grep -q 'app-0.9.12.html' APP-Applications/pdf-studio/app-0.9.14.html
          grep -q 'app-0.9.13-debug.js' APP-Applications/pdf-studio/app-0.9.14.html
          grep -q 'runtime0914/loader.js' APP-Applications/pdf-studio/app-0.9.14.html
          grep -q 'nLabCopyDebug' APP-Applications/pdf-studio/runtime/app-0.9.13-debug.js
          grep -q 'nLabLoadDemoDirect0913' APP-Applications/pdf-studio/runtime/app-0.9.13-debug.js
          for i in $(seq 1 6); do
            n=$(printf '%02d' "$i")
            test -s "APP-Applications/pdf-studio/runtime0914/app0914.part${n}.txt"
          done
          cat APP-Applications/pdf-studio/runtime0914/app0914.part*.txt > /tmp/app0914.js
          node --check /tmp/app0914.js
          grep -q 'Alpha 0.9.14' /tmp/app0914.js
          for i in $(seq 1 11); do
            n=$(printf '%02d' "$i")
            test -s "APP-Applications/pdf-studio/runtime/app098.part${n}.js"
          done
          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          grep -q '"test": "0.9.14"' APP-Applications/pdf-studio/versions.json

      - name: Build shared nLab demo corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow reportlab python-docx openpyxl
          python Library/demo/generate_demo.py --output Library/demo
          test -s Library/demo/nLab-DEMO-CORPUS-v2.zip
          test -s Library/demo/demo-manifest.json
          test -s Library/demo/demo-catalog-v2.json
          test -s Library/demo/previews/pdf-texte.jpg
          test -s Library/demo/files/demo-input/PDF/pdf-texte-actif.pdf
          python -m zipfile -t Library/demo/nLab-DEMO-CORPUS-v2.zip
          grep -q '"privacy": "synthetic-only"' Library/demo/demo-manifest.json
          grep -q '"fileCount": 39' Library/demo/demo-manifest.json
          grep -q '"files":' Library/demo/demo-manifest.json
          grep -q '"cards":' Library/demo/demo-catalog-v2.json
          echo 'nLab DEMO CORPUS v2 generated: OK'

          python Library/demo/generate_studio_demo.py --output Library/demo
          test -s Library/demo/nLab-DEMO-CORPUS-v3.zip
          test -s Library/demo/demo-catalog-v3.json
          test -s Library/demo/demo-gallery-v3.json
          test -s Library/demo/manifests/index.json
          test -s Library/demo/manifests/data.json
          test -s Library/demo/manifests/qr-barcode.json
          test -s Library/demo/files/demo-input/Images/calibration-regles-300x150.png
          test -s Library/demo/files/demo-input/Data/dataset-validation-complet.xlsx
          test -s Library/demo/files/demo-input/QR-Barcode/datamatrix-test.svg
          python -m zipfile -t Library/demo/nLab-DEMO-CORPUS-v3.zip
          grep -q '"studioDemo"' Library/demo/demo-manifest.json
          echo 'nLab Studio DEMO v3 generated: OK'

      - name: Publish site and generated corpus to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nLab deployment bot'
          git config user.email 'noreply@users.noreply.github.com'

          # Work on the existing gh-pages branch so workflow files are never modified
          # by the GitHub App token (which intentionally has no workflows permission).
          git fetch origin gh-pages
          rm -rf /tmp/nlab-gh-pages
          git worktree add /tmp/nlab-gh-pages origin/gh-pages

          # Sync the public site while preserving the existing .github directory.
          rsync -a --delete --exclude='.git' --exclude='.github/' ./ /tmp/nlab-gh-pages/
          cd /tmp/nlab-gh-pages
          git add -A
          git add -f Library/demo/nLab-DEMO-CORPUS-v2.zip Library/demo/nLab-DEMO-CORPUS-v3.zip
          git add -f Library/demo/demo-manifest.json Library/demo/demo-catalog-v2.json Library/demo/demo-catalog-v3.json Library/demo/demo-gallery-v3.json
          git add -f Library/demo/manifests Library/demo/packs
          git commit -m 'build: publish nLab Web + demo corpus v3 [skip ci]' || true
          git push origin HEAD:gh-pages
