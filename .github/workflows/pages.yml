name: Publish nLab Web to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Info/**'
      - 'APP-Applications/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PDF Studio public runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          grep -q 'Alpha 0.9.10' APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app098.part11.js' APP-Applications/pdf-studio/app-0.9.10.html
          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          for n in $(seq -w 1 11); do
            test -s "APP-Applications/pdf-studio/runtime/app098.part${n}.js"
          done
          echo 'PDF Studio Alpha 0.9.10 public launcher: OK'

      - name: Publish main to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nLab deployment bot'
          git config user.email 'noreply@users.noreply.github.com'
          git push --force origin HEAD:gh-pages
