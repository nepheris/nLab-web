name: Deploy nLab Web

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Info/**'
      - 'APP-Applications/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PDF Studio public runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.8.html
          grep -q 'app-0.9.8.html' APP-Applications/pdf-studio/app.html
          grep -q 'Alpha 0.9.8' APP-Applications/pdf-studio/app-0.9.8.html
          grep -q 'Alpha 0.9.8' APP-Applications/pdf-studio/index.html
          for n in $(seq -w 1 11); do
            test -s "APP-Applications/pdf-studio/runtime/app098.part${n}.js"
          done
          echo 'PDF Studio Alpha 0.9.8 public runtime: OK'

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
