name: Publish nLab Web to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Info/**'
      - 'APP-Applications/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PDF Studio public runtime
        shell: bash
        run: |
          set -euo pipefail
          # Stable route stays on 0.9.10
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          # Test route 0.9.11 must also be complete
          test -s APP-Applications/pdf-studio/app-0.9.11.html
          grep -q 'Alpha 0.9.11' APP-Applications/pdf-studio/app-0.9.11.html
          for n in $(seq -w 1 6); do
            test -s "APP-Applications/pdf-studio/runtime/app0911.patch${n}.js"
          done
          for n in $(seq -w 1 11); do
            test -s "APP-Applications/pdf-studio/runtime/app098.part${n}.js"
          done
          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          grep -q '"test": "0.9.11"' APP-Applications/pdf-studio/versions.json
          echo 'PDF Studio stable + test launchers: OK'

      - name: Publish main to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nLab deployment bot'
          git config user.email 'noreply@users.noreply.github.com'
          git push --force origin HEAD:gh-pages
