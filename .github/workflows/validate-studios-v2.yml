name: Validate specialized Studios V2

on:
  push:
    branches: [main]
    paths:
      - 'APP-Applications/image-studio/**'
      - 'APP-Applications/ocr-studio/**'
      - 'APP-Applications/code-studio/**'
      - 'APP-Applications/json-studio/**'
      - 'APP-Applications/data-studio/**'
      - 'APP-Applications/file-studio/**'
      - 'APP-Applications/qr-barcode-studio/**'
      - 'APP-Applications/markdown-studio/**'
      - 'APP-Applications/dataset-generator-studio/**'
      - 'APP-Applications/document-studio/**'
      - 'APP-Applications/spreadsheet-studio/**'
      - 'APP-Applications/pdf-sign/**'
      - 'APP-Applications/studios/**'
      - 'APP-Applications/_shared/studio-v2/**'
      - 'tests/studios-v2-ui.mjs'
      - 'tests/studios-v2-functional.mjs'
      - 'tests/studios-v2-roundtrip.mjs'
      - 'tests/studios-v2-exhaustive.mjs'
      - 'tests/studios-v2-audit.mjs'
      - 'tests/studio-current-compat.mjs'
      - 'tests/studio_feature_contracts.json'
      - 'tests/validate_studio_features.py'
      - 'tests/validate_studio_registries.py'
      - '.github/workflows/validate-studios-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'APP-Applications/**'
      - 'tests/studios-v2-ui.mjs'
      - 'tests/studios-v2-audit.mjs'
      - 'tests/studio-current-compat.mjs'
      - 'tests/validate_studio_registries.py'
      - 'tests/validate_studio_features.py'
      - 'tests/studio_feature_contracts.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static Studio contracts
        run: |
          python tests/validate_studio_registries.py
          python tests/validate_studio_features.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke specialized V2
        run: |
          python -m http.server 8770 --bind 127.0.0.1 >/tmp/nlab-studios-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8770/APP-Applications/studios/ >/dev/null && break
            sleep 1
          done
          NLAB_BASE_URL=http://127.0.0.1:8770/ node tests/studios-v2-ui.mjs

      - name: Result integrity specialized V2
        run: |
          python -m http.server 8772 --bind 127.0.0.1 >/tmp/nlab-studios-v2-roundtrip-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8772/APP-Applications/studios/ >/dev/null && break
            sleep 1
          done
          NLAB_BASE_URL=http://127.0.0.1:8772/ node tests/studios-v2-roundtrip.mjs

      - name: Exhaustive specialized V2
        run: |
          python -m http.server 8773 --bind 127.0.0.1 >/tmp/nlab-studios-v2-exhaustive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8773/APP-Applications/studios/ >/dev/null && break
            sleep 1
          done
          NLAB_BASE_URL=http://127.0.0.1:8773/ node tests/studios-v2-exhaustive.mjs

      - name: Functional acceptance specialized V2
        run: |
          python -m http.server 8771 --bind 127.0.0.1 >/tmp/nlab-studios-v2-functional-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8771/APP-Applications/studios/ >/dev/null && break
            sleep 1
          done
          NLAB_BASE_URL=http://127.0.0.1:8771/ node tests/studios-v2-functional.mjs

      - name: CURRENT compatibility routes
        run: |
          python -m http.server 8776 --bind 127.0.0.1 >/tmp/nlab-studio-current-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8776/APP-Applications/studios/ >/dev/null && break
            sleep 1
          done
          NLAB_BASE_URL=http://127.0.0.1:8776/ node tests/studio-current-compat.mjs

      - name: Full Studio audit
        run: |
          python -m http.server 8774 --bind 127.0.0.1 >/tmp/nlab-studios-v2-audit-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8774/APP-Applications/studios/ >/dev/null && break
            sleep 1
          done
          NLAB_BASE_URL=http://127.0.0.1:8774/ node tests/studios-v2-audit.mjs
