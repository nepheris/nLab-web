name: Validate PDF Studio public

on:
  push:
    branches:
      - main
    paths:
      - 'APP-Applications/pdf-studio/**'
      - 'Library/demo/**'
      - '.github/workflows/sync-pdf-studio.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'APP-Applications/pdf-studio/**'
      - 'Library/demo/**'
      - '.github/workflows/sync-pdf-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stable, test snapshot and demo corpus
        shell: bash
        run: |
          set -euo pipefail

          # CURRENT reste 0.9.10
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          grep -q 'Alpha 0.9.10' APP-Applications/pdf-studio/app-0.9.10.html

          # TEST 0.9.17 reste séparé
          test -s APP-Applications/pdf-studio/app-0.9.14.html
          test -s APP-Applications/pdf-studio/runtime/app-0.9.13-debug.js
          grep -q 'app-0.9.12.html' APP-Applications/pdf-studio/app-0.9.14.html
          grep -q 'app-0.9.13-debug.js' APP-Applications/pdf-studio/app-0.9.14.html
          grep -q 'nLabCopyDebug' APP-Applications/pdf-studio/runtime/app-0.9.13-debug.js
          grep -q 'nLabLoadDemoDirect0913' APP-Applications/pdf-studio/runtime/app-0.9.13-debug.js
          for i in $(seq 1 6); do
            n=$(printf '%02d' "$i")
            test -s "APP-Applications/pdf-studio/runtime0914/app0914.part${n}.txt"
          done
          cat APP-Applications/pdf-studio/runtime0914/app0914.part*.txt > /tmp/app0914.js
          node --check /tmp/app0914.js
          grep -q 'Alpha 0.9.14' /tmp/app0914.js
          grep -q 'richText0914' /tmp/app0914.js
          grep -q 'redactionPlan0914' /tmp/app0914.js

          # Patch TEST 0.9.15 : Date D + règles de nom de fichier
          test -s APP-Applications/pdf-studio/app-0.9.15.html
          test -s APP-Applications/pdf-studio/runtime0915/stamp-dates-filename.js
          grep -q 'runtime0915/stamp-dates-filename.js' APP-Applications/pdf-studio/app-0.9.15.html
          node --check APP-Applications/pdf-studio/runtime0915/stamp-dates-filename.js
          grep -q 'DATE_D_FMT' APP-Applications/pdf-studio/runtime0915/stamp-dates-filename.js
          grep -q 'stampRenameFile0915' APP-Applications/pdf-studio/runtime0915/stamp-dates-filename.js

          # TEST 0.9.16 : constructeur visible + JSON privé + DSS
          test -s APP-Applications/pdf-studio/app-0.9.16.html
          test -s APP-Applications/pdf-studio/runtime0916/stamp-auth-dss.js
          grep -q 'runtime0916/stamp-auth-dss.js' APP-Applications/pdf-studio/app-0.9.16.html
          node --check APP-Applications/pdf-studio/runtime0916/stamp-auth-dss.js
          grep -q 'stampHub0916' APP-Applications/pdf-studio/runtime0916/stamp-auth-dss.js
          grep -q 'STAMP_DRIVE_FILE_0916' APP-Applications/pdf-studio/runtime0916/stamp-auth-dss.js
          grep -q 'PAdES_BASELINE_LT' APP-Applications/pdf-studio/runtime0916/stamp-auth-dss.js

          # TEST 0.9.17 : profil personnel + favoris + nommage modulaire
          test -s APP-Applications/pdf-studio/app-0.9.17.html
          for f in profile naming stamp-help auth-gate; do test -s "APP-Applications/pdf-studio/runtime0917/${f}.js"; node --check "APP-Applications/pdf-studio/runtime0917/${f}.js"; done
          grep -q 'runtime0917/profile.js' APP-Applications/pdf-studio/app-0.9.17.html
          grep -q 'runtime0917/naming.js' APP-Applications/pdf-studio/app-0.9.17.html
          grep -q 'runtime0917/stamp-help.js' APP-Applications/pdf-studio/app-0.9.17.html
          grep -q 'runtime0917/auth-gate.js' APP-Applications/pdf-studio/app-0.9.17.html
          grep -q 'PROFILE_FILE0917' APP-Applications/pdf-studio/runtime0917/profile.js
          grep -q 'SYSTEM_RULES0917' APP-Applications/pdf-studio/runtime0917/naming.js
          grep -q 'advancedStampHelp0917' APP-Applications/pdf-studio/runtime0917/stamp-help.js
          grep -q 'signatureAuthGate0917' APP-Applications/pdf-studio/runtime0917/auth-gate.js

          # TEST 0.9.18 : variables communes + workspace JSON + Drive visible
          test -s APP-Applications/pdf-studio/app-0.9.18.html
          for f in variables workspace google-drive; do test -s "APP-Applications/pdf-studio/runtime0918/${f}.js"; node --check "APP-Applications/pdf-studio/runtime0918/${f}.js"; done
          grep -q 'runtime0918/variables.js' APP-Applications/pdf-studio/app-0.9.18.html
          grep -q 'runtime0918/workspace.js' APP-Applications/pdf-studio/app-0.9.18.html
          grep -q 'runtime0918/google-drive.js' APP-Applications/pdf-studio/app-0.9.18.html
          grep -q 'NLAB_VARIABLES_0918' APP-Applications/pdf-studio/runtime0918/variables.js
          grep -q 'WORKSPACE_SCHEMA0918' APP-Applications/pdf-studio/runtime0918/workspace.js
          grep -q 'drive.file' APP-Applications/pdf-studio/runtime0918/google-drive.js
          grep -q 'select_account' APP-Applications/pdf-studio/runtime0918/google-drive.js
          grep -q 'Authorization.*Bearer' APP-Applications/pdf-studio/runtime0918/google-drive.js
          test -s APP-Applications/pdf-studio/config/workspace-v2.example.json

          # TEST 0.9.19 : configuration canonique + 5 dates visibles + espace personnel
          test -s APP-Applications/pdf-studio/app-0.9.19.html
          test -s APP-Applications/pdf-studio/runtime0919/unified-config-auth.js
          node --check APP-Applications/pdf-studio/runtime0919/unified-config-auth.js
          grep -q 'runtime0919/unified-config-auth.js' APP-Applications/pdf-studio/app-0.9.19.html
          grep -q 'canonicalStampDates0919' APP-Applications/pdf-studio/runtime0919/unified-config-auth.js
          grep -q 'personalSpaceRibbon0919' APP-Applications/pdf-studio/runtime0919/unified-config-auth.js
          test -s APP-Applications/pdf-studio/config/app-config.v1.json
          python -m json.tool APP-Applications/pdf-studio/config/app-config.v1.json >/dev/null
          grep -q '"STAMP_DATE"' APP-Applications/pdf-studio/config/app-config.v1.json
          grep -q '"DATE_D"' APP-Applications/pdf-studio/config/app-config.v1.json
          test -s APP-Applications/pdf-studio/docs/configuration-0.9.19.md

          # TEST 0.9.20 : consolidation UX + identifiants d’annotations + aide OAuth
          test -s APP-Applications/pdf-studio/app-0.9.20.html
          test -s APP-Applications/pdf-studio/runtime0920/ux-consolidation.js
          node --check APP-Applications/pdf-studio/runtime0920/ux-consolidation.js
          grep -q 'runtime0920/ux-consolidation.js' APP-Applications/pdf-studio/app-0.9.20.html
          grep -q 'annotationObjectGroup20' APP-Applications/pdf-studio/runtime0920/ux-consolidation.js
          grep -q 'oauthHelp0920' APP-Applications/pdf-studio/runtime0920/ux-consolidation.js
          grep -q 'penDelete0920' APP-Applications/pdf-studio/runtime0920/ux-consolidation.js

          # TEST 0.9.21 : ZIP local + portée commune réutilisable + multi-pages + preview optimisation
          test -s APP-Applications/pdf-studio/app-0.9.21.html
          test -s APP-Applications/_shared/selection-scope.js
          test -s APP-Applications/_shared/archive-workspace.js
          test -f .nojekyll
          node --check APP-Applications/_shared/selection-scope.js
          node --check APP-Applications/_shared/archive-workspace.js
          for f in page-scope archive-workspace output-routing; do test -s "APP-Applications/pdf-studio/runtime0921/${f}.js"; node --check "APP-Applications/pdf-studio/runtime0921/${f}.js"; done
          grep -q '../_shared/selection-scope.js' APP-Applications/pdf-studio/app-0.9.21.html
          grep -q '../_shared/archive-workspace.js' APP-Applications/pdf-studio/app-0.9.21.html
          grep -q 'runtime0921/page-scope.js' APP-Applications/pdf-studio/app-0.9.21.html
          grep -q 'runtime0921/archive-workspace.js' APP-Applications/pdf-studio/app-0.9.21.html
          grep -q 'runtime0921/output-routing.js' APP-Applications/pdf-studio/app-0.9.21.html
          grep -q 'NLAB_SELECTION_SCOPE' APP-Applications/pdf-studio/runtime0921/page-scope.js
          grep -q 'targetPages0921' APP-Applications/pdf-studio/runtime0921/page-scope.js
          grep -q 'runPdfQuickOcr=async function' APP-Applications/pdf-studio/runtime0921/page-scope.js
          grep -q 'extractPage=async function' APP-Applications/pdf-studio/runtime0921/page-scope.js
          grep -q 'deleteCurrentPage=async function' APP-Applications/pdf-studio/runtime0921/page-scope.js
          grep -q 'NLAB_ARCHIVE_WORKSPACE' APP-Applications/pdf-studio/runtime0921/archive-workspace.js
          grep -q 'buildWorkspaceBlob0921' APP-Applications/pdf-studio/runtime0921/archive-workspace.js
          grep -q 'exportArchiveZip0921' APP-Applications/pdf-studio/runtime0921/archive-workspace.js
          grep -q 'extractArchiveFolder0921' APP-Applications/pdf-studio/runtime0921/archive-workspace.js
          grep -q "mode==='same-source'" APP-Applications/pdf-studio/runtime0921/output-routing.js
          grep -q 'optimizationPreview0921' APP-Applications/pdf-studio/runtime0921/page-scope.js

          # TEST 0.9.22 : traduction bilingue BRK104
          test -s APP-Applications/pdf-studio/app-0.9.22.html
          test -s APP-Applications/pdf-studio/runtime0922/bilingual-translation.js
          node --check APP-Applications/pdf-studio/runtime0922/bilingual-translation.js
          grep -q 'runtime0922/bilingual-translation.js' APP-Applications/pdf-studio/app-0.9.22.html
          grep -q 'BRK104-pdf-bilingual-translator' APP-Applications/pdf-studio/runtime0922/bilingual-translation.js
          grep -q 'side_by_side' APP-Applications/pdf-studio/runtime0922/bilingual-translation.js
          grep -q 'facing_pages' APP-Applications/pdf-studio/runtime0922/bilingual-translation.js

          # TEST 0.9.23 : correctif publication/runtime + traduction BRK104
          test -s APP-Applications/pdf-studio/app-0.9.23.html
          grep -q '../_shared/selection-scope.js' APP-Applications/pdf-studio/app-0.9.23.html
          grep -q '../_shared/archive-workspace.js' APP-Applications/pdf-studio/app-0.9.23.html
          grep -q 'runtime0922/bilingual-translation.js' APP-Applications/pdf-studio/app-0.9.23.html
          grep -q 'Alpha 0.9.23 TEST' APP-Applications/pdf-studio/app-0.9.23.html
          ! grep -q 'const dssFetchBase0918=dssFetch0916' APP-Applications/pdf-studio/runtime0918/google-drive.js
          ! grep -q '^dssFetch0916=async function' APP-Applications/pdf-studio/runtime0919/unified-config-auth.js
          grep -q '"version": "0.9.23"' APP-Applications/pdf-studio/versions.json

          # TEST 0.9.24 : remise à plat fonctionnelle et UI explicite
          test -s APP-Applications/pdf-studio/app-0.9.24.html
          test -s APP-Applications/pdf-studio/runtime0924/functional-ui.js
          node --check APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'runtime0924/functional-ui.js' APP-Applications/pdf-studio/app-0.9.24.html
          grep -q './versions.json' APP-Applications/pdf-studio/app-0.9.24.html
          grep -q 'NLAB_PDF_RELEASE' APP-Applications/pdf-studio/app-0.9.24.html
          grep -q 'pageSelectCheck0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'applySelectedObjectToScope0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'pageScopeMaster0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'nlabMenu0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'configSection0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'namingSection0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'translationSection0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'loadDriveDocuments0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'exportZip0924' APP-Applications/pdf-studio/runtime0924/functional-ui.js
          grep -q 'safePatch' APP-Applications/pdf-studio/app-0.9.24.html
          grep -q '"releaseRegistry": "./versions.json"' APP-Applications/pdf-studio/config/app-config.v1.json
          ! grep -q '"version": "0.9.19"' APP-Applications/pdf-studio/config/app-config.v1.json
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('APP-Applications/pdf-studio/app-0.9.24.html').read_text()
          m=re.search(r'<script>\s*(\(async\(\)=>\{.*?\}\)\(\);)\s*</script></body>',s,re.S)
          assert m, 'loader 0.9.24 introuvable'
          Path('/tmp/pdf-studio-0924-loader.js').write_text(m.group(1))
          PY
          node --check /tmp/pdf-studio-0924-loader.js
          # TEST 0.9.25 : contrôles visibles persistants
          test -s APP-Applications/pdf-studio/app-0.9.25.html
          test -s APP-Applications/pdf-studio/runtime0925/visible-controls.js
          node --check APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'runtime0925/visible-controls.js' APP-Applications/pdf-studio/app-0.9.25.html
          grep -q 'pageCheck0925' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'pageScopeBar0925' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Page en cours' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Pages cochées' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Tout le document' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'configZero0925' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Variables nommées' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Préconfiguration JSON' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Dates globales des tampons' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'sourceLoad0925' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'destinationLoad0925' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'Activer ce mode' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'même dossier que la source' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'sidebarGrip0925' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q 'nLab Web' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q '../studios/' APP-Applications/pdf-studio/runtime0925/visible-controls.js
          grep -q '"test": "2.4.0"' APP-Applications/pdf-studio/versions.json

          test -s APP-Applications/pdf-studio/config/user-config.example.json
          test -s APP-Applications/pdf-studio/config/stamps-v3.example.json
          test -s APP-Applications/pdf-studio/config/google-auth.example.json
          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          grep -q '"test": "2.4.0"' APP-Applications/pdf-studio/versions.json

          # Corpus commun nLab : génération reproductible et ZIP valide
          test -s Library/demo/generate_demo.py
          test -s Library/demo/index.html
          python -m pip install --disable-pip-version-check --quiet pillow reportlab python-docx openpyxl
          python Library/demo/generate_demo.py --output /tmp/nlab-demo
          test -s /tmp/nlab-demo/nLab-DEMO-CORPUS-v2.zip
          python -m zipfile -t /tmp/nlab-demo/nLab-DEMO-CORPUS-v2.zip
          grep -q '"privacy": "synthetic-only"' /tmp/nlab-demo/demo-manifest.json
          grep -q '"fileCount": 39' /tmp/nlab-demo/demo-manifest.json
          grep -q '"files":' /tmp/nlab-demo/demo-manifest.json
          test -s /tmp/nlab-demo/previews/pdf-texte.jpg
          test -s /tmp/nlab-demo/files/demo-input/PDF/pdf-texte-actif.pdf

          if grep -q 'drive.google.com/uc?export=download' APP-Applications/pdf-studio/app-0.9.12.html; then
            echo 'ERROR: test snapshot depends on Google Drive at runtime.' >&2
            exit 1
          fi

          echo 'PDF Studio CURRENT 0.9.10 + TEST 2.4.0 + DEMO v2: OK'

          # PDF Studio 2.0 architecture contract
          test -s APP-Applications/pdf-studio/v2/index.html
          test -s APP-Applications/pdf-studio/v2/pdf-v2.js
          test -s APP-Applications/pdf-studio/v2/studio-manifest.js
          test -s APP-Applications/_shared/studio-v2/core.js
          test -s APP-Applications/_shared/studio-v2/frame.js
          test -s APP-Applications/_shared/studio-v2/help.js
          grep -q 'pdf-v2.js' APP-Applications/pdf-studio/v2/index.html
          grep -q 'mountStudioV2' APP-Applications/pdf-studio/v2/pdf-v2.js
          grep -q 'featureId' APP-Applications/pdf-studio/v2/studio-manifest.js

          # PDF Studio 1.0 standalone static contract
          test -s APP-Applications/pdf-studio/v1/index.html
          test -s APP-Applications/pdf-studio/v1/pdf-studio.css
          test -s APP-Applications/pdf-studio/v1/pdf-studio.js
          test -s APP-Applications/pdf-studio/v1/pdf-engine.js
          test -s APP-Applications/pdf-studio/v1/annotations.js
          test -s APP-Applications/pdf-studio/v1/pdf-tools.js
          test -s APP-Applications/pdf-studio/v1/advanced-tools.js
          test -s APP-Applications/pdf-studio/v1/document-conversion.js
          for f in core variables file-io drive icons history templates; do test -s "APP-Applications/_shared/studio-v1/$f.js"; done
          test -s APP-Applications/_shared/studio-v1/tokens.css
          test -s APP-Applications/_shared/studio-v1/studio.css
          for f in APP-Applications/pdf-studio/v1/pdf-studio.js APP-Applications/pdf-studio/v1/pdf-engine.js APP-Applications/pdf-studio/v1/annotations.js APP-Applications/pdf-studio/v1/pdf-tools.js APP-Applications/pdf-studio/v1/advanced-tools.js APP-Applications/pdf-studio/v1/document-conversion.js APP-Applications/_shared/studio-v1/core.js APP-Applications/_shared/studio-v1/variables.js APP-Applications/_shared/studio-v1/file-io.js APP-Applications/_shared/studio-v1/drive.js APP-Applications/_shared/studio-v1/icons.js APP-Applications/_shared/studio-v1/history.js APP-Applications/_shared/studio-v1/templates.js; do node --input-type=module --check < "$f"; done
          grep -q 'nlab-wordmark.svg' APP-Applications/pdf-studio/v1/index.html
          grep -q '0. Configuration' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="connectGoogle"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="pageScope"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="thumbZoom"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="sidebarResizer"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="runDss"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="addQr"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="pdfToPng"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="inspectForms"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="applyRedactions"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="pickCompare"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="cleanMetadata"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="textLayer"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="selectedFilesSummary"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="ribbonContext"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="namingMode"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="outputPathTemplate"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="sectionOptimize"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="sectionConversion"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="headerFooterQr"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'id="copyRenamedSelection"' APP-Applications/pdf-studio/v1/index.html
          grep -q 'Aucun runtime 0.9.x' APP-Applications/pdf-studio/v1/pdf-studio.js
          ! grep -q 'runtime09' APP-Applications/pdf-studio/v1/index.html
          test -s tests/pdf-studio-v1-ui.mjs
          node --check tests/pdf-studio-v1-ui.mjs

      - name: Install Chromium for PDF Studio 1.0
        shell: bash
        run: |
          node --check tests/pdf-studio-v2-ui.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance PDF Studio 1.0
        shell: bash
        run: |
          set -euo pipefail
          python tests/generate_pdf_studio_v1_fixtures.py
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/nlab-v1-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8765/APP-Applications/pdf-studio/v1/ >/dev/null && break
            sleep 1
          done
          PDF_STUDIO_URL=http://127.0.0.1:8765/APP-Applications/pdf-studio/v1/ \
          PDF_STUDIO_FIXTURE=/tmp/pdf-studio-v1.pdf \
          PDF_STUDIO_FIXTURE2=/tmp/pdf-studio-v1-b.pdf \
          PDF_STUDIO_IMAGE=/tmp/pdf-studio-v1-signature.png \
          PDF_STUDIO_CONFIG=/tmp/pdf-studio-v1-config.json \
          PDF_STUDIO_DOCX=/tmp/pdf-studio-v1.docx \
          PDF_STUDIO_ODT=/tmp/pdf-studio-v1.odt \
          node tests/pdf-studio-v1-ui.mjs

      - name: Browser acceptance PDF Studio V2
        shell: bash
        run: |
          set -euo pipefail
          python tests/generate_pdf_studio_v1_fixtures.py
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/nlab-v2-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8766/APP-Applications/pdf-studio/v2/ >/dev/null && break
            sleep 1
          done
          PDF_STUDIO_V2_URL=http://127.0.0.1:8766/APP-Applications/pdf-studio/v2/ \
          PDF_STUDIO_FIXTURE=/tmp/pdf-studio-v1.pdf \
          PDF_STUDIO_FIXTURE2=/tmp/pdf-studio-v1-b.pdf \
          node tests/pdf-studio-v2-ui.mjs

      - name: Build PDF Studio 1.0 portable package
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_pdf_studio_v1_package.py
          ZIP="APP-Applications/pdf-studio/downloads/nLab-PDF-Studio-1.0.0-PORTABLE.zip"
          test -s "$ZIP"
          python -m zipfile -t "$ZIP"
          python - <<'PY'
          from zipfile import ZipFile
