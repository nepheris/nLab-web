name: Validate PDF Studio public

on:
  push:
    branches:
      - main
    paths:
      - 'APP-Applications/pdf-studio/**'
      - '.github/workflows/sync-pdf-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stable and test snapshots
        shell: bash
        run: |
          set -euo pipefail
          # CURRENT reste 0.9.10
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          grep -q 'Alpha 0.9.10' APP-Applications/pdf-studio/app-0.9.10.html

          # TEST 0.9.12 est publié séparément
          test -s APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'Alpha 0.9.12' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'archivePattern0912' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'DATAMATRIX' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'treeCompare0912' APP-Applications/pdf-studio/app-0.9.12.html
          grep -q 'stampFormatB0912' APP-Applications/pdf-studio/app-0.9.12.html

          test -s APP-Applications/pdf-studio/config/user-config.example.json
          test -s APP-Applications/pdf-studio/config/stamps-v3.example.json
          test -s APP-Applications/pdf-studio/config/google-auth.example.json

          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          grep -q '"test": "0.9.12"' APP-Applications/pdf-studio/versions.json

          test -s Library/demo/generate_demo.py
          test -s Library/demo/index.html
          python -m pip install --disable-pip-version-check --quiet pillow reportlab python-docx openpyxl
          python Library/demo/generate_demo.py --output /tmp/nlab-demo
          test -s /tmp/nlab-demo/nLab-DEMO-CORPUS-v2.zip
          python -m zipfile -t /tmp/nlab-demo/nLab-DEMO-CORPUS-v2.zip
          grep -q '"privacy": "synthetic-only"' /tmp/nlab-demo/demo-manifest.json
          grep -q '"fileCount": 39' /tmp/nlab-demo/demo-manifest.json

          if grep -q 'drive.google.com/uc?export=download' APP-Applications/pdf-studio/app-0.9.12.html; then
            echo 'ERROR: test snapshot depends on Google Drive at runtime.' >&2
            exit 1
          fi
          echo 'PDF Studio CURRENT 0.9.10 + TEST 0.9.12: OK'
