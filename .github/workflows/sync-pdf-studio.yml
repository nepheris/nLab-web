name: Validate PDF Studio public

on:
  push:
    branches:
      - main
    paths:
      - 'APP-Applications/pdf-studio/**'
      - '.github/workflows/sync-pdf-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate stable and test snapshots
        shell: bash
        run: |
          set -euo pipefail
          # CURRENT remains 0.9.10
          test -s APP-Applications/pdf-studio/app.html
          test -s APP-Applications/pdf-studio/app-0.9.10.html
          grep -q 'app-0.9.10.html' APP-Applications/pdf-studio/app.html
          grep -q 'Alpha 0.9.10' APP-Applications/pdf-studio/app-0.9.10.html
          # TEST 0.9.11 is published separately
          test -s APP-Applications/pdf-studio/app-0.9.11.html
          grep -q 'Alpha 0.9.11' APP-Applications/pdf-studio/app-0.9.11.html
          grep -q 'VERSION DE TEST' APP-Applications/pdf-studio/app-0.9.11.html
          for n in $(seq -w 1 6); do
            test -s "APP-Applications/pdf-studio/runtime/app0911.patch${n}.js"
          done
          for n in $(seq -w 1 11); do
            test -s "APP-Applications/pdf-studio/runtime/app098.part${n}.js"
          done
          test -s APP-Applications/pdf-studio/versions.json
          grep -q '"current": "0.9.10"' APP-Applications/pdf-studio/versions.json
          grep -q '"test": "0.9.11"' APP-Applications/pdf-studio/versions.json
          if grep -q 'drive.google.com/uc?export=download' APP-Applications/pdf-studio/app-0.9.11.html; then
            echo 'ERROR: test launcher depends on Google Drive.' >&2
            exit 1
          fi
          echo 'PDF Studio CURRENT 0.9.10 + TEST 0.9.11: OK'
